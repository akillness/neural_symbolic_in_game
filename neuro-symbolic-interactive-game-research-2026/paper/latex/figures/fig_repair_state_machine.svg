<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">TRACE-RPG compact validate-repair-commit state machine</title>
  <desc id="svg-desc">Every candidate is validated and recorded. Valid candidates receive a defensive check before commit; invalid candidates repair within K or fall back unchanged.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#E69F00"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7A7A7A"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #202124; }
      .section { font-size: 28px; font-weight: 700; }
      .box-title { font-size: 26px; font-weight: 700; }
      .body { font-size: 25px; font-weight: 400; }
      .small { font-size: 24px; font-weight: 400; }
      .note { font-size: 24px; font-style: italic; fill: #5F6368; }
      .arrow-label { font-size: 24px; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#FFFFFF"/>
  <rect x="20" y="15" width="520" height="90" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="20" y="15" width="9" height="90" fill="#0072B2"/>
  <text x="45" y="50" class="section" text-anchor="start">BOUNDED ATTEMPTS</text>
  <text x="45" y="79" class="small" text-anchor="start" fill="#5F6368">at most K + 1 recorded candidates</text>
  <rect x="560" y="15" width="320" height="90" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="560" y="15" width="9" height="90" fill="#E69F00"/>
  <text x="585" y="50" class="section" text-anchor="start">FROZEN CLASSES</text>
  <text x="585" y="79" class="small" text-anchor="start" fill="#5F6368">guided / oracle / none</text>
  <rect x="30" y="155" width="130" height="90" rx="7" fill="#EEF0F2" stroke="#7A7A7A" stroke-width="2"/>
  <rect x="30" y="155" width="8" height="90" rx="4" fill="#7A7A7A"/>
  <text x="99" y="188" class="box-title" text-anchor="middle">Candidate</text>
  <text x="99" y="217" class="small" text-anchor="middle"><tspan x="99" dy="0">a_j</tspan></text>
  <rect x="190" y="155" width="130" height="90" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="190" y="155" width="8" height="90" rx="4" fill="#0072B2"/>
  <text x="259" y="188" class="box-title" text-anchor="middle">Validate</text>
  <text x="259" y="217" class="small" text-anchor="middle"><tspan x="259" dy="0">V(c_t,a_j)</tspan></text>
  <rect x="350" y="145" width="155" height="110" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="350" y="145" width="8" height="110" rx="4" fill="#0072B2"/>
  <text x="431" y="178" class="box-title" text-anchor="middle">Record j</text>
  <text x="431" y="207" class="small" text-anchor="middle"><tspan x="431" dy="0">candidate</tspan><tspan x="431" dy="25">errors+hash</tspan></text>
  <polygon points="575,135 645,200 575,265 505,200" fill="#FFFFFF" stroke="#0072B2" stroke-width="3"/>
  <text x="575" y="194" class="box-title" text-anchor="middle"><tspan x="575" dy="0">valid?</tspan></text>
  <rect x="675" y="125" width="190" height="95" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="675" y="125" width="8" height="95" rx="4" fill="#009E73"/>
  <text x="774" y="158" class="box-title" text-anchor="middle">Defense check</text>
  <text x="774" y="187" class="small" text-anchor="middle"><tspan x="774" dy="0">before mutation</tspan></text>
  <rect x="700" y="250" width="150" height="82" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="700" y="250" width="8" height="82" rx="4" fill="#009E73"/>
  <text x="779" y="283" class="box-title" text-anchor="middle">COMMIT</text>
  <text x="779" y="312" class="small" text-anchor="middle"><tspan x="779" dy="0">atomic T</tspan></text>
  <polygon points="575,285 645,345 575,405 505,345" fill="#FFFFFF" stroke="#E69F00" stroke-width="3"/>
  <text x="575" y="339" class="box-title" text-anchor="middle"><tspan x="575" dy="0">j &lt; K?</tspan></text>
  <rect x="245" y="430" width="180" height="88" rx="7" fill="#FFF2DD" stroke="#E69F00" stroke-width="2"/>
  <rect x="245" y="430" width="8" height="88" rx="4" fill="#E69F00"/>
  <text x="339" y="463" class="box-title" text-anchor="middle">Guided repair</text>
  <text x="339" y="492" class="small" text-anchor="middle"><tspan x="339" dy="0">rho(a_j,E_j)</tspan></text>
  <rect x="450" y="430" width="180" height="88" rx="7" fill="#EAF4FA" stroke="#56B4E9" stroke-width="2"/>
  <rect x="450" y="430" width="8" height="88" rx="4" fill="#56B4E9"/>
  <text x="544" y="463" class="box-title" text-anchor="middle">Oracle repair</text>
  <text x="544" y="492" class="small" text-anchor="middle"><tspan x="544" dy="0">state upper bound</tspan></text>
  <rect x="700" y="430" width="165" height="88" rx="7" fill="#EEF0F2" stroke="#7A7A7A" stroke-width="2"/>
  <rect x="700" y="430" width="8" height="88" rx="4" fill="#7A7A7A"/>
  <text x="786" y="463" class="box-title" text-anchor="middle">FALLBACK</text>
  <text x="786" y="492" class="small" text-anchor="middle"><tspan x="786" dy="0">no mutation</tspan></text>
  <line class="connector" x1="160" y1="200" x2="190" y2="200" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <line class="connector" x1="320" y1="200" x2="350" y2="200" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M645 180 H675" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="632" y="147" width="46" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="655" y="168" class="arrow-label" text-anchor="middle" fill="#009E73">yes</text>
  </g>
  <path class="connector" d="M770 220 V250" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <path class="connector" d="M575 265 V285" stroke="#E69F00" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="580" y="257" width="50" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="605" y="278" class="arrow-label" text-anchor="middle" fill="#E69F00">no</text>
  </g>
  <path class="connector" d="M535 385 V410 H335 V430" stroke="#E69F00" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <path class="connector" d="M615 385 V410 H540 V430" stroke="#56B4E9" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="397" y="384" width="146" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="470" y="405" class="arrow-label" text-anchor="middle" fill="#E69F00">selected arm</text>
  </g>
  <path class="connector" d="M645 345 H675 V474 H700" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="644" y="315" width="50" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="669" y="336" class="arrow-label" text-anchor="middle" fill="#7A7A7A">no</text>
  </g>
  <path class="connector" d="M540 518 V538 H95 V245" stroke="#E69F00" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" stroke-dasharray="9 6"/>
  <path class="connector" d="M335 518 V538" stroke="#E69F00" stroke-width="3" fill="none" stroke-dasharray="9 6"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="198" y="511" width="225" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="310" y="532" class="arrow-label" text-anchor="middle" fill="#E69F00">next candidate attempt</text>
  </g>
  <rect x="20" y="548" width="500" height="58" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="20" y="548" width="9" height="58" fill="#7A7A7A"/>
  <text x="45" y="583" class="section" text-anchor="start">Callback return assumed</text>
  <rect x="560" y="540" width="320" height="66" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="560" y="540" width="8" height="66" rx="4" fill="#0072B2"/>
  <text x="724" y="573" class="box-title" text-anchor="middle">Finalize trace</text>
  <text x="724" y="602" class="small" text-anchor="middle"><tspan x="724" dy="0">semantic replay</tspan></text>
  <path class="connector" d="M775 332 H885 V573 H880" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <path class="connector" d="M782 518 V540" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
</svg>

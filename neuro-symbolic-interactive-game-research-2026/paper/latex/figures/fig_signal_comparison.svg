<text x="24" y="82" class="title" text-anchor="start">COMPARISON | 60 INPUTS x 3 ARMS</text>
<text x="24" y="124" class="subtitle" text-anchor="start">Unsafe != semantic mismatch | no time trend</text>
<text x="24" y="166" class="small" text-anchor="start">A/D: allow / deny</text>

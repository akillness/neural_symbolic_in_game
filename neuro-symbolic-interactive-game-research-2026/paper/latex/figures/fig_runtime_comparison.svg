<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="940" viewBox="0 0 1800 940" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Fixed-game native runtime comparison</title>
<desc id="svg-desc">Eight assigned rows for one authored quest, showing requested selector, representation and repeat, status, goal, observed host calls, elapsed time, safety, semantic replay, and fresh-engine disposition. Fresh-engine labels are VALID, INVALID, NOT_RUN, or NOT_OBSERVED; NR means not reported; color is supplementary to explicit labels.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#202124}.title{font-size:36px;font-weight:700}.subtitle{font-size:28px;fill:#5F6368}.head{font-size:30px;font-weight:700}.cell{font-size:28px}.small{font-size:28px;fill:#5F6368}.status{font-size:28px;font-weight:700}.rule{stroke:#C9CDD1;stroke-width:1}</style>
<rect x="0" y="0" width="1800" height="940" fill="#FFFFFF"/>
<text x="35" y="38" class="title">FIXED-GAME NATIVE RUNTIME COMPARISON | 8 ASSIGNED ROWS</text>
<text x="35" y="86" class="subtitle">One authored quest; n=2 per selector/representation cell; NR = not reported, not zero. Labels remain explicit; color is supplementary.</text>
<rect x="35" y="105" width="1730" height="100" fill="#EEF0F2" stroke="#C9CDD1"/>
<text x="45" y="130" class="head" aria-label="Row"><tspan x="45" dy="0">Row</tspan></text>
<text x="145" y="130" class="head" aria-label="Requested selector"><tspan x="145" dy="0">Requested</tspan><tspan x="145" dy="42">selector</tspan></text>
<text x="345" y="130" class="head" aria-label="Representation / repeat"><tspan x="345" dy="0">Representation</tspan><tspan x="345" dy="42">/ repeat</tspan></text>
<text x="590" y="130" class="head" aria-label="Status"><tspan x="590" dy="0">Status</tspan></text>
<text x="800" y="130" class="head" aria-label="Goal"><tspan x="800" dy="0">Goal</tspan></text>
<text x="940" y="130" class="head" aria-label="Observed host calls"><tspan x="940" dy="0">Host</tspan><tspan x="940" dy="42">calls</tspan></text>
<text x="1080" y="130" class="head" aria-label="Elapsed (s)"><tspan x="1080" dy="0">Elapsed</tspan><tspan x="1080" dy="42">(s)</tspan></text>
<text x="1240" y="130" class="head" aria-label="Safety / replay"><tspan x="1240" dy="0">Safety</tspan><tspan x="1240" dy="42">R record-link / E engine</tspan></text>
<g id="row-1" aria-labelledby="row-1-title row-1-desc">
<title id="row-1-title">row 1 failure_reason=harness_config_serialization</title>
<desc id="row-1-desc">status=HARNESS; goal=NR; safety=NOT_OBSERVED; replay=NR; engine=NOT_OBSERVED; failure_reason=harness_config_serialization</desc>
<rect x="35" y="205" width="1730" height="72" fill="#FFFFFF"/>
<line x1="35" y1="277" x2="1765" y2="277" class="rule"/>
<text x="45" y="249" class="cell">1</text>
<text x="145" y="249" class="cell">gpt-6.1-sol</text>
<text x="345" y="249" class="cell">general_rule / r1</text>

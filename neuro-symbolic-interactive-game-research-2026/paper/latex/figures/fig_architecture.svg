  <rect x="610" y="494" width="8" height="142" rx="4" fill="#007A59"/>
  <text x="749" y="527" class="box-title" text-anchor="middle">REPLAY</text>
  <text x="749" y="560" class="small" text-anchor="middle"><tspan x="749" dy="0">recompute T,</tspan><tspan x="749" dy="29">compare state</tspan></text>
  <rect x="796" y="597" width="78" height="32" rx="4" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <text x="835" y="621" class="tag" text-anchor="middle">ENG1</text>
  <rect x="746" y="597" width="44" height="32" rx="4" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="768" y="621" class="tag" text-anchor="middle">E1</text>

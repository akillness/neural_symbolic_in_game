  <line class="connector" x1="689" y1="383" x2="656" y2="383" stroke="#666A6D" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <path class="connector" d="M561 454 V474 H450 V494" stroke="#666A6D" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <path class="connector" d="M689 230 H672 V292 H155 V494" stroke="#007A59" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

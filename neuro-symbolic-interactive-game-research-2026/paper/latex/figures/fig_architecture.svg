<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">TRACE-RPG transaction pipeline overview</title>
  <desc id="svg-desc">One generated event read left to right: an untrusted proposal crosses the trust boundary as a typed candidate, and seven deterministic checks grouped into six state-relative families decide it from external policy and state. A failing candidate may be repaired from its typed errors at most K times or falls back unchanged; a passing candidate is rechecked and committed. Evidence tags are scope labels only: E1 offline conformance, E2 screening-pilot-only, and ENG1 engineering-only. No figure element supports population efficacy or player-experience claims. The lower strip shows the playable ledger grammar derived from committed snapshots.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A05A00"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#007A59"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#666A6D"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #202124; }
      .section { font-size: 32px; font-weight: 700; }
      .box-title { font-size: 30px; font-weight: 700; }
      .body { font-size: 29px; font-weight: 400; }
      .small { font-size: 28px; font-weight: 400; }
      .note { font-size: 28px; font-style: italic; fill: #5F6368; }
      .arrow-label { font-size: 28px; font-weight: 700; }
    </style>
  </defs>
  <style>.tag { font-size: 28px; font-weight: 700; } .ledger { font-size: 28px; font-weight: 700; } .legend { font-size: 28px; font-weight: 700; }</style>
  <rect x="0" y="0" width="900" height="860" fill="#FFFFFF"/>
  <rect x="10" y="15" width="880" height="635" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="10" y="15" width="9" height="635" fill="#0072B2"/>
  <text x="35" y="50" class="section" text-anchor="start">ONE GENERATED EVENT AS A TRANSACTION</text>
  <text x="25" y="96" class="legend" text-anchor="start" fill="#0072B2">E1 offline</text>
  <text x="245" y="96" class="legend" text-anchor="start" fill="#A05A00">E2 screening-pilot-only</text>
  <text x="575" y="96" class="legend" text-anchor="start" fill="#007A59">ENG1 engineering-only</text>
  <rect x="20" y="130" width="190" height="142" rx="7" fill="#EEF0F2" stroke="#666A6D" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="20" y="130" width="8" height="142" rx="4" fill="#666A6D"/>
  <text x="119" y="163" class="box-title" text-anchor="middle">PROPOSAL</text>
  <text x="119" y="196" class="small" text-anchor="middle"><tspan x="119" dy="0">untrusted</tspan><tspan x="119" dy="29">model output</tspan></text>
  <rect x="160" y="233" width="44" height="32" rx="4" fill="#FFF2DD" stroke="#A05A00" stroke-width="2"/>
  <text x="182" y="257" class="tag" text-anchor="middle">E2</text>
  <rect x="243" y="130" width="190" height="142" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="243" y="130" width="8" height="142" rx="4" fill="#0072B2"/>
  <text x="342" y="163" class="box-title" text-anchor="middle">PARSER</text>
  <text x="342" y="196" class="small" text-anchor="middle"><tspan x="342" dy="0">type-strict</tspan><tspan x="342" dy="29">known keys</tspan></text>
  <rect x="383" y="233" width="44" height="32" rx="4" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="405" y="257" class="tag" text-anchor="middle">E1</text>
  <rect x="466" y="130" width="190" height="142" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="466" y="130" width="8" height="142" rx="4" fill="#0072B2"/>
  <text x="565" y="163" class="box-title" text-anchor="middle">POLICY</text>
  <text x="565" y="196" class="small" text-anchor="middle"><tspan x="565" dy="0">external q_t</tspan><tspan x="565" dy="29">who may act</tspan></text>
  <rect x="572" y="233" width="78" height="32" rx="4" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <text x="611" y="257" class="tag" text-anchor="middle">ENG1</text>
  <rect x="522" y="233" width="44" height="32" rx="4" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="544" y="257" class="tag" text-anchor="middle">E1</text>
  <rect x="689" y="130" width="190" height="142" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="689" y="130" width="8" height="142" rx="4" fill="#0072B2"/>
  <text x="788" y="163" class="box-title" text-anchor="middle">VALIDATE</text>
  <text x="788" y="196" class="small" text-anchor="middle"><tspan x="788" dy="0">7 checks</tspan><tspan x="788" dy="29">6 families -&gt; E</tspan></text>
  <rect x="795" y="233" width="78" height="32" rx="4" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <text x="834" y="257" class="tag" text-anchor="middle">ENG1</text>
  <rect x="745" y="233" width="44" height="32" rx="4" fill="#FFF2DD" stroke="#A05A00" stroke-width="2"/>
  <text x="767" y="257" class="tag" text-anchor="middle">E2</text>
  <rect x="695" y="233" width="44" height="32" rx="4" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="717" y="257" class="tag" text-anchor="middle">E1</text>
  <rect x="466" y="312" width="190" height="142" rx="7" fill="#EEF0F2" stroke="#666A6D" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="466" y="312" width="8" height="142" rx="4" fill="#666A6D"/>
  <text x="565" y="345" class="box-title" text-anchor="middle">FALLBACK</text>
  <text x="565" y="378" class="small" text-anchor="middle"><tspan x="565" dy="0">j = K:</tspan><tspan x="565" dy="29">no mutation</tspan></text>
  <rect x="606" y="415" width="44" height="32" rx="4" fill="#FFF2DD" stroke="#A05A00" stroke-width="2"/>
  <text x="628" y="439" class="tag" text-anchor="middle">E2</text>
  <rect x="556" y="415" width="44" height="32" rx="4" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="578" y="439" class="tag" text-anchor="middle">E1</text>
  <rect x="689" y="312" width="190" height="142" rx="7" fill="#FFF2DD" stroke="#A05A00" stroke-width="2"/>
  <rect x="689" y="312" width="8" height="142" rx="4" fill="#A05A00"/>
  <text x="788" y="345" class="box-title" text-anchor="middle">REPAIR</text>
  <text x="788" y="378" class="small" text-anchor="middle"><tspan x="788" dy="0">invalid: rho</tspan><tspan x="788" dy="29">reads a and E</tspan></text>
  <rect x="829" y="415" width="44" height="32" rx="4" fill="#FFF2DD" stroke="#A05A00" stroke-width="2"/>
  <text x="851" y="439" class="tag" text-anchor="middle">E2</text>
  <rect x="779" y="415" width="44" height="32" rx="4" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="801" y="439" class="tag" text-anchor="middle">E1</text>
  <rect x="20" y="494" width="270" height="142" rx="7" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <rect x="20" y="494" width="8" height="142" rx="4" fill="#007A59"/>
  <text x="159" y="527" class="box-title" text-anchor="middle">COMMIT</text>
  <text x="159" y="560" class="small" text-anchor="middle"><tspan x="159" dy="0">all v_i hold:</tspan><tspan x="159" dy="29">recheck, T(c_t, a)</tspan></text>
  <rect x="206" y="597" width="78" height="32" rx="4" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <text x="245" y="621" class="tag" text-anchor="middle">ENG1</text>
  <rect x="156" y="597" width="44" height="32" rx="4" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="178" y="621" class="tag" text-anchor="middle">E1</text>
  <rect x="315" y="494" width="270" height="142" rx="7" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <rect x="315" y="494" width="8" height="142" rx="4" fill="#007A59"/>
  <text x="454" y="527" class="box-title" text-anchor="middle">RECORD</text>
  <text x="454" y="560" class="small" text-anchor="middle"><tspan x="454" dy="0">SHA-256 linked</tspan><tspan x="454" dy="29">terminal row</tspan></text>
  <rect x="501" y="597" width="78" height="32" rx="4" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <text x="540" y="621" class="tag" text-anchor="middle">ENG1</text>
  <rect x="451" y="597" width="44" height="32" rx="4" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="473" y="621" class="tag" text-anchor="middle">E1</text>

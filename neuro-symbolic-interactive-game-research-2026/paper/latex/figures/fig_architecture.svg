<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1070" viewBox="0 0 1280 1070" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">TRACE-RPG transaction pipeline overview</title>
  <desc id="svg-desc">One generated event read left to right: an untrusted proposal crosses the trust boundary as a typed candidate, and seven deterministic checks grouped into six state-relative families decide it from external policy and state. Evidence tags are scope labels only: DESIGN structure, E1 offline conformance, and ENG1 engineering-only. No figure element supports population efficacy or player-experience claims. The lower strip shows the playable ledger grammar derived from committed snapshots.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A05A00"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#007A59"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#666A6D"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #202124; }
      .section { font-size: 32px; font-weight: 700; }
      .box-title { font-size: 30px; font-weight: 700; }
      .body { font-size: 29px; font-weight: 400; }
      .small { font-size: 28px; font-weight: 400; }
      .note { font-size: 28px; font-style: italic; fill: #5F6368; }
      .arrow-label { font-size: 28px; font-weight: 700; }
    </style>
  </defs>
<style>.tag,.ledger,.legend {font-size:28px;font-weight:700}</style>
  <rect x="0" y="0" width="1280" height="1070" fill="#FFFFFF"/>
  <rect x="10" y="15" width="1260" height="800" rx="7" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <text x="35" y="65" class="section" text-anchor="start">ONE GENERATED EVENT AS A TRANSACTION</text>
  <text x="35" y="110" class="legend" text-anchor="start" fill="#666A6D">DESIGN structure</text>
  <text x="365" y="110" class="legend" text-anchor="start" fill="#0072B2">E1 offline</text>
  <text x="700" y="110" class="legend" text-anchor="start" fill="#007A59">ENG1 engineering-only</text>
  <rect x="20" y="140" width="270" height="200" rx="7" fill="#EEF0F2" stroke="#666A6D" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="155" y="190" class="box-title" text-anchor="middle">PROPOSAL</text>
  <text x="155" y="238" class="small" text-anchor="middle"><tspan x="155" dy="0">untrusted</tspan><tspan x="155" dy="38">model output</tspan></text>
  <text x="155" y="318" class="tag" text-anchor="middle" fill="#666A6D">DESIGN</text>
  <rect x="362" y="140" width="270" height="200" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="497" y="190" class="box-title" text-anchor="middle">PARSER</text>
  <text x="497" y="238" class="small" text-anchor="middle"><tspan x="497" dy="0">type-strict</tspan><tspan x="497" dy="38">known keys</tspan></text>
  <text x="497" y="318" class="tag" text-anchor="middle" fill="#0072B2">E1</text>
  <rect x="674" y="140" width="270" height="200" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="809" y="190" class="box-title" text-anchor="middle">POLICY</text>
  <text x="809" y="238" class="small" text-anchor="middle"><tspan x="809" dy="0">external <tspan font-style="italic">q<tspan baseline-shift="sub" font-size="70%">t</tspan></tspan></tspan><tspan x="809" dy="38">who may act</tspan></text>
  <text x="769" y="318" class="tag" text-anchor="middle" fill="#0072B2">E1</text>
  <text x="849" y="318" class="tag" text-anchor="middle" fill="#007A59">ENG1</text>
  <rect x="986" y="140" width="270" height="200" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="1121" y="190" class="box-title" text-anchor="middle">VALIDATE</text>
  <text x="1121" y="238" class="small" text-anchor="middle"><tspan x="1121" dy="0">7 checks</tspan><tspan x="1121" dy="38">6 families → <tspan font-style="italic">E</tspan></tspan></text>
  <text x="1081" y="318" class="tag" text-anchor="middle" fill="#0072B2">E1</text>
  <text x="1161" y="318" class="tag" text-anchor="middle" fill="#007A59">ENG1</text>
  <rect x="664" y="365" width="270" height="200" rx="7" fill="#EEF0F2" stroke="#666A6D" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="799" y="415" class="box-title" text-anchor="middle">FALLBACK</text>
  <text x="799" y="463" class="small" text-anchor="middle"><tspan x="799" dy="0">j = K:</tspan><tspan x="799" dy="38">no mutation</tspan></text>
  <text x="799" y="543" class="tag" text-anchor="middle" fill="#0072B2">E1</text>
  <rect x="986" y="365" width="270" height="200" rx="7" fill="#FFF2DD" stroke="#A05A00" stroke-width="2"/>
  <text x="1121" y="415" class="box-title" text-anchor="middle">REPAIR</text>
  <text x="1121" y="463" class="small" text-anchor="middle"><tspan x="1121" dy="0">invalid: <tspan font-style="italic">ρ(a,E)</tspan></tspan><tspan x="1121" dy="38">reads <tspan font-style="italic">a</tspan> and <tspan font-style="italic">E</tspan></tspan></text>
  <text x="1121" y="543" class="tag" text-anchor="middle" fill="#0072B2">E1</text>
  <rect x="20" y="590" width="380" height="200" rx="7" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <text x="210" y="640" class="box-title" text-anchor="middle">COMMIT</text>
  <text x="210" y="688" class="small" text-anchor="middle"><tspan x="210" dy="0">all <tspan font-style="italic">v<tspan baseline-shift="sub" font-size="70%">i</tspan></tspan> hold:</tspan><tspan x="210" dy="38">recheck, <tspan font-style="italic">T(c<tspan baseline-shift="sub" font-size="70%">t</tspan>, a)</tspan></tspan></text>
  <text x="170" y="768" class="tag" text-anchor="middle" fill="#0072B2">E1</text>
  <text x="250" y="768" class="tag" text-anchor="middle" fill="#007A59">ENG1</text>
  <rect x="450" y="590" width="380" height="200" rx="7" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <text x="640" y="640" class="box-title" text-anchor="middle">RECORD</text>
  <text x="640" y="688" class="small" text-anchor="middle"><tspan x="640" dy="0">SHA-256 linked</tspan><tspan x="640" dy="38">terminal row</tspan></text>
  <text x="600" y="768" class="tag" text-anchor="middle" fill="#0072B2">E1</text>
  <text x="680" y="768" class="tag" text-anchor="middle" fill="#007A59">ENG1</text>
  <rect x="880" y="590" width="380" height="200" rx="7" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <text x="1070" y="640" class="box-title" text-anchor="middle">REPLAY</text>
  <text x="1070" y="688" class="small" text-anchor="middle"><tspan x="1070" dy="0">recompute <tspan font-style="italic">T</tspan>,</tspan><tspan x="1070" dy="38">compare state</tspan></text>
  <text x="1030" y="768" class="tag" text-anchor="middle" fill="#0072B2">E1</text>
  <text x="1110" y="768" class="tag" text-anchor="middle" fill="#007A59">ENG1</text>
  <line class="connector" x1="638" y1="240" x2="668" y2="240" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <line class="connector" x1="950" y1="240" x2="980" y2="240" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <line class="connector" x1="326" y1="132" x2="326" y2="355" stroke="#A05A00" stroke-width="3" fill="none" stroke-dasharray="11 7"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="272" y="68" width="80" height="192" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="312" y="164" class="section" text-anchor="middle" dominant-baseline="central" fill="#A05A00" transform="rotate(-90 312 164)">TRUST</text>
  </g>
  <line class="connector" x1="296" y1="240" x2="356" y2="240" stroke="#666A6D" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <line class="connector" x1="1080" y1="346" x2="1080" y2="359" stroke="#A05A00" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <path class="connector" d="M1220 359 V346" stroke="#A05A00" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" stroke-dasharray="9 6"/>
  <line class="connector" x1="980" y1="465" x2="940" y2="465" stroke="#666A6D" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <path class="connector" d="M800 575 V578 H640 V584" stroke="#666A6D" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <path class="connector" d="M980 240 H960 V355 H210 V584" stroke="#007A59" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="154" y="426" width="112" height="68" rx="2" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="210" y="470" class="arrow-label" text-anchor="middle" fill="#007A59">valid</text>
  </g>
  <line class="connector" x1="406" y1="690" x2="444" y2="690" stroke="#007A59" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <line class="connector" x1="836" y1="690" x2="874" y2="690" stroke="#007A59" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="10" y="830" width="1260" height="225" rx="7" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <text x="35" y="875" class="section" text-anchor="start">PLAYABLE LEDGER GRAMMAR (ENG1)</text>
  <rect x="24" y="890" width="292" height="160" rx="7" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <text x="170" y="934" class="ledger" text-anchor="middle">ENTRY #N</text>
  <text x="170" y="980" class="small" text-anchor="middle"><tspan x="170" dy="0">COMMITTED</tspan><tspan x="170" dy="32">7 checks hold</tspan></text>
  <rect x="336" y="890" width="292" height="160" rx="7" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <text x="482" y="934" class="ledger" text-anchor="middle">CONTRIB. #N</text>
  <text x="482" y="980" class="small" text-anchor="middle"><tspan x="482" dy="0">STAGE a&gt;b</tspan><tspan x="482" dy="32">CHAIN k/3</tspan></text>
  <rect x="648" y="890" width="292" height="160" rx="7" fill="#FFF2DD" stroke="#A05A00" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="794" y="934" class="ledger" text-anchor="middle">HELD</text>
  <text x="794" y="980" class="small" text-anchor="middle"><tspan x="794" dy="0">reason code</tspan><tspan x="794" dy="32">NEXT VALID</tspan></text>
  <rect x="960" y="890" width="292" height="160" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <text x="1106" y="934" class="ledger" text-anchor="middle">RULE</text>
  <text x="1106" y="980" class="small" text-anchor="middle"><tspan x="1106" dy="0">GATE family</tspan><tspan x="1106" dy="32">recalled later</tspan></text>
</svg>

  <text x="126" y="755" class="small" text-anchor="middle"><tspan x="126" dy="0">COMMITTED</tspan><tspan x="126" dy="34">7 checks hold</tspan></text>
  <rect x="235" y="690" width="205" height="110" rx="7" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
  <rect x="235" y="690" width="8" height="110" rx="4" fill="#007A59"/>

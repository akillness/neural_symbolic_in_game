<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">TRACE-RPG compact trust-boundary architecture</title>
  <desc id="svg-desc">Non-authoritative context conditions an untrusted proposal. A strict adapter and state-relative validator select commit, bounded repair, or unchanged fallback.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#E69F00"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7A7A7A"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #202124; }
      .section { font-size: 28px; font-weight: 700; }
      .box-title { font-size: 26px; font-weight: 700; }
      .body { font-size: 25px; font-weight: 400; }
      .small { font-size: 24px; font-weight: 400; }
      .note { font-size: 24px; font-style: italic; fill: #5F6368; }
      .arrow-label { font-size: 24px; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="600" fill="#FFFFFF"/>
  <rect x="20" y="15" width="860" height="95" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="20" y="15" width="9" height="95" fill="#7A7A7A"/>
  <text x="45" y="50" class="section" text-anchor="start">NON-AUTHORITATIVE CONTEXT  z_t</text>
  <text x="45" y="79" class="small" text-anchor="start" fill="#5F6368">retrieval / memory / soft scores / rationale / future affect</text>
  <rect x="20" y="125" width="860" height="310" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="20" y="125" width="9" height="310" fill="#0072B2"/>
  <text x="45" y="160" class="section" text-anchor="start">PROPOSAL TO VALIDATION TO TERMINAL OUTCOME</text>
  <text x="45" y="189" class="small" text-anchor="start" fill="#5F6368">solid = deterministic path / dashed = bounded retry</text>
  <rect x="40" y="210" width="125" height="92" rx="7" fill="#EEF0F2" stroke="#7A7A7A" stroke-width="2"/>
  <rect x="40" y="210" width="8" height="92" rx="4" fill="#7A7A7A"/>
  <text x="106" y="243" class="box-title" text-anchor="middle">Proposal</text>
  <text x="106" y="272" class="small" text-anchor="middle"><tspan x="106" dy="0">a_j</tspan><tspan x="106" dy="25">untrusted</tspan></text>
  <rect x="190" y="210" width="135" height="92" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="190" y="210" width="8" height="92" rx="4" fill="#0072B2"/>
  <text x="261" y="243" class="box-title" text-anchor="middle">Adapter</text>
  <text x="261" y="272" class="small" text-anchor="middle"><tspan x="261" dy="0">schema</tspan><tspan x="261" dy="25">known keys</tspan></text>
  <rect x="355" y="200" width="165" height="112" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="355" y="200" width="8" height="112" rx="4" fill="#0072B2"/>
  <text x="441" y="233" class="box-title" text-anchor="middle">Validator</text>
  <text x="441" y="262" class="small" text-anchor="middle"><tspan x="441" dy="0">V(c_t,a_j)</tspan><tspan x="441" dy="25">hard gates</tspan></text>
  <rect x="590" y="185" width="125" height="92" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="590" y="185" width="8" height="92" rx="4" fill="#009E73"/>
  <text x="656" y="218" class="box-title" text-anchor="middle">COMMIT</text>
  <text x="656" y="247" class="small" text-anchor="middle"><tspan x="656" dy="0">atomic T</tspan></text>
  <rect x="745" y="185" width="120" height="92" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="745" y="185" width="8" height="92" rx="4" fill="#009E73"/>
  <text x="809" y="218" class="box-title" text-anchor="middle">Bridge</text>
  <text x="809" y="247" class="small" text-anchor="middle"><tspan x="809" dy="0">versioned</tspan><tspan x="809" dy="25">event</tspan></text>
  <rect x="575" y="330" width="150" height="82" rx="7" fill="#FFF2DD" stroke="#E69F00" stroke-width="2"/>
  <rect x="575" y="330" width="8" height="82" rx="4" fill="#E69F00"/>
  <text x="654" y="363" class="box-title" text-anchor="middle">REPAIR</text>
  <text x="654" y="392" class="small" text-anchor="middle"><tspan x="654" dy="0">rho(a_j,E_j)</tspan></text>
  <rect x="725" y="330" width="140" height="82" rx="7" fill="#EEF0F2" stroke="#7A7A7A" stroke-width="2"/>
  <rect x="725" y="330" width="8" height="82" rx="4" fill="#7A7A7A"/>
  <text x="799" y="363" class="box-title" text-anchor="middle">FALLBACK</text>
  <text x="799" y="392" class="small" text-anchor="middle"><tspan x="799" dy="0">unchanged</tspan></text>
  <line class="connector" x1="165" y1="256" x2="190" y2="256" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <line class="connector" x1="325" y1="256" x2="355" y2="256" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M520 230 H590" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="519" y="197" width="72" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="555" y="218" class="arrow-label" text-anchor="middle" fill="#009E73">valid</text>
  </g>
  <line class="connector" x1="715" y1="230" x2="745" y2="230" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <path class="connector" d="M520 278 H548 V371 H575" stroke="#E69F00" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="507" y="323" width="86" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="550" y="344" class="arrow-label" text-anchor="middle" fill="#E69F00">invalid</text>
  </g>
  <path class="connector" d="M520 295 H535 V425 H795 V412" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="595" y="400" width="170" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="680" y="421" class="arrow-label" text-anchor="middle" fill="#7A7A7A">budget exhausted</text>
  </g>
  <path class="connector" d="M575 386 H545 V302 H520" stroke="#E69F00" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" stroke-dasharray="9 6"/>
  <rect x="20" y="450" width="860" height="130" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="20" y="450" width="9" height="130" fill="#009E73"/>
  <text x="45" y="485" class="section" text-anchor="start">CANONICAL AUTHORITY</text>
  <rect x="40" y="515" width="235" height="48" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="40" y="515" width="8" height="48" rx="4" fill="#009E73"/>
  <text x="161" y="548" class="box-title" text-anchor="middle">Prior state  G_t</text>
  <rect x="330" y="515" width="235" height="48" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="330" y="515" width="8" height="48" rx="4" fill="#0072B2"/>
  <text x="451" y="548" class="box-title" text-anchor="middle">Stored policy  q_t</text>
  <rect x="630" y="515" width="235" height="48" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="630" y="515" width="8" height="48" rx="4" fill="#009E73"/>
  <text x="751" y="548" class="box-title" text-anchor="middle">Final state  c_(t+1)</text>
  <path class="connector" d="M448 515 V312" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="462" y="447" width="156" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="540" y="468" class="arrow-label" text-anchor="middle" fill="#0072B2">validator reads</text>
  </g>
  <path class="connector" d="M865 230 H875 V500 H748 V515" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <path class="connector" d="M805 412 V515" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
</svg>

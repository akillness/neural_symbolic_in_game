  <rect x="665" y="690" width="205" height="110" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="665" y="690" width="8" height="110" rx="4" fill="#0072B2"/>
  <text x="771" y="724" class="ledger" text-anchor="middle">RULE</text>
  <text x="771" y="755" class="small" text-anchor="middle"><tspan x="771" dy="0">GATE family</tspan><tspan x="771" dy="34">recalled later</tspan></text>

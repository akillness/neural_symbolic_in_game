  <line class="connector" x1="585" y1="535" x2="610" y2="535" stroke="#007A59" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="10" y="640" width="880" height="175" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">TRACE-RPG trust-boundary architecture</title>
  <desc id="svg-desc">A stochastic proposal is parsed by a strict adapter and checked by an encoded state-relative validator before commit, bounded repair, or unchanged fallback. The validator reads canonical state and stored policy; the repair callback rho consumes only the prior candidate and the structured error set. Soft context z_t is separate from canonical authority c_t.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#E69F00"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7A7A7A"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #202124; }
      .section { font-size: 25px; font-weight: 700; }
      .box-title { font-size: 24px; font-weight: 700; }
      .body { font-size: 21px; font-weight: 400; }
      .small { font-size: 19px; font-weight: 400; }
      .note { font-size: 19px; font-style: italic; fill: #5F6368; }
      .arrow-label { font-size: 19px; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="1440" height="700" fill="#FFFFFF"/>
  <rect x="25" y="20" width="1390" height="145" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="25" y="20" width="9" height="145" fill="#7A7A7A"/>
  <text x="50" y="55" class="section" text-anchor="start">NON-AUTHORITATIVE CONTEXT  z_t</text>
  <text x="50" y="84" class="small" text-anchor="start" fill="#5F6368">May condition a proposal; cannot directly mutate canonical state</text>
  <rect x="55" y="85" width="285" height="60" rx="7" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2"/>
  <rect x="55" y="85" width="8" height="60" rx="4" fill="#7A7A7A"/>
  <text x="201" y="118" class="box-title" text-anchor="middle">Retrieval / memory</text>
  <rect x="375" y="85" width="285" height="60" rx="7" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2"/>
  <rect x="375" y="85" width="8" height="60" rx="4" fill="#7A7A7A"/>
  <text x="521" y="118" class="box-title" text-anchor="middle">Soft narrative scores</text>
  <rect x="695" y="85" width="285" height="60" rx="7" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2"/>
  <rect x="695" y="85" width="8" height="60" rx="4" fill="#7A7A7A"/>
  <text x="841" y="118" class="box-title" text-anchor="middle">Model rationale</text>
  <rect x="1015" y="85" width="355" height="60" rx="7" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="1015" y="85" width="8" height="60" rx="4" fill="#7A7A7A"/>
  <text x="1196" y="118" class="box-title" text-anchor="middle">Future affect estimate</text>
  <rect x="25" y="185" width="1390" height="320" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="25" y="185" width="9" height="320" fill="#0072B2"/>
  <text x="50" y="220" class="section" text-anchor="start">PROPOSAL–VALIDATION–COMMIT PATH</text>
  <text x="50" y="249" class="small" text-anchor="start" fill="#5F6368">Solid arrows are current deterministic data/control flow; dashed arrows are bounded retry</text>
  <rect x="55" y="265" width="190" height="105" rx="7" fill="#EEF0F2" stroke="#7A7A7A" stroke-width="2"/>
  <rect x="55" y="265" width="8" height="105" rx="4" fill="#7A7A7A"/>
  <text x="154" y="298" class="box-title" text-anchor="middle">Proposal</text>
  <text x="154" y="327" class="small" text-anchor="middle"><tspan x="154" dy="0">response a_j</tspan><tspan x="154" dy="25">untrusted</tspan></text>
  <rect x="290" y="265" width="220" height="105" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="290" y="265" width="8" height="105" rx="4" fill="#0072B2"/>
  <text x="404" y="298" class="box-title" text-anchor="middle">Strict adapter</text>
  <text x="404" y="327" class="small" text-anchor="middle"><tspan x="404" dy="0">response schema</tspan><tspan x="404" dy="25">exact JSON types</tspan></text>
  <rect x="555" y="255" width="250" height="125" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="555" y="255" width="8" height="125" rx="4" fill="#0072B2"/>
  <text x="684" y="288" class="box-title" text-anchor="middle">Encoded validator</text>
  <text x="684" y="317" class="small" text-anchor="middle"><tspan x="684" dy="0">V(c_t, a_j)</tspan><tspan x="684" dy="25">hard predicates + E_j</tspan></text>
  <rect x="905" y="225" width="190" height="100" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="905" y="225" width="8" height="100" rx="4" fill="#009E73"/>
  <text x="1004" y="258" class="box-title" text-anchor="middle">COMMIT</text>
  <text x="1004" y="287" class="small" text-anchor="middle"><tspan x="1004" dy="0">atomic T(c_t,a_j)</tspan><tspan x="1004" dy="25">only if valid</tspan></text>
  <rect x="1170" y="225" width="205" height="100" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="1170" y="225" width="8" height="100" rx="4" fill="#009E73"/>
  <text x="1276" y="258" class="box-title" text-anchor="middle">Game bridge</text>
  <text x="1276" y="287" class="small" text-anchor="middle"><tspan x="1276" dy="0">versioned JSON</tspan><tspan x="1276" dy="25">committed event</tspan></text>
  <rect x="895" y="375" width="210" height="100" rx="7" fill="#FFF2DD" stroke="#E69F00" stroke-width="2"/>
  <rect x="895" y="375" width="8" height="100" rx="4" fill="#E69F00"/>
  <text x="1004" y="408" class="box-title" text-anchor="middle">REPAIR</text>
  <text x="1004" y="437" class="small" text-anchor="middle"><tspan x="1004" dy="0">rho(a_j, E_j), j &lt; K</tspan><tspan x="1004" dy="25">never reads c_t</tspan></text>
  <rect x="1170" y="375" width="205" height="100" rx="7" fill="#EEF0F2" stroke="#7A7A7A" stroke-width="2"/>
  <rect x="1170" y="375" width="8" height="100" rx="4" fill="#7A7A7A"/>
  <text x="1276" y="408" class="box-title" text-anchor="middle">FALLBACK</text>
  <text x="1276" y="437" class="small" text-anchor="middle"><tspan x="1276" dy="0">c_(t+1) = c_t</tspan><tspan x="1276" dy="25">when budget ends</tspan></text>
  <line x1="245" y1="318" x2="290" y2="318" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <line x1="510" y1="318" x2="555" y2="318" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M805 292 H855 V275 H905" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="817" y="247" width="76" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
  <text x="855" y="268" class="arrow-label" text-anchor="middle" fill="#009E73">valid</text>
  <line x1="1095" y1="275" x2="1170" y2="275" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M805 340 H850 V425 H895" stroke="#E69F00" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="760" y="384" width="130" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
  <text x="825" y="405" class="arrow-label" text-anchor="middle" fill="#E69F00">invalid, j &lt; K</text>
  <path d="M805 352 H825 V498 H1125 V425 H1170" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="955" y="482" width="150" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
  <text x="1030" y="503" class="arrow-label" text-anchor="middle" fill="#7A7A7A">invalid, j = K</text>
  <path d="M895 442 H860 V482 H150 V370" stroke="#E69F00" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" stroke-dasharray="10 7"/>
  <rect x="403" y="457" width="245" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
  <text x="525" y="478" class="arrow-label" text-anchor="middle" fill="#E69F00">repaired candidate  a_(j+1)</text>
  <rect x="25" y="525" width="1390" height="150" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="25" y="525" width="9" height="150" fill="#009E73"/>
  <text x="50" y="560" class="section" text-anchor="start">CANONICAL AUTHORITY  c_t = (G_t, q_t)</text>
  <text x="50" y="589" class="small" text-anchor="start" fill="#5F6368">Canonical owner supplies typed world state and stored policy; record history h_(&lt;t) is kept separately and is never read by validation</text>
  <rect x="55" y="600" width="365" height="55" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="55" y="600" width="8" height="55" rx="4" fill="#009E73"/>
  <text x="241" y="633" class="box-title" text-anchor="middle">Prior canonical state  c_t</text>
  <rect x="495" y="600" width="380" height="55" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="495" y="600" width="8" height="55" rx="4" fill="#0072B2"/>
  <text x="689" y="633" class="box-title" text-anchor="middle">Externally supplied policy  q_t</text>
  <rect x="970" y="600" width="405" height="55" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="970" y="600" width="8" height="55" rx="4" fill="#009E73"/>
  <text x="1176" y="633" class="box-title" text-anchor="middle">Final canonical state  c_(t+1)</text>
  <path d="M1000 325 V350 H1140 V600" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M1270 475 V600" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <line x1="685" y1="600" x2="685" y2="380" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="598" y="424" width="205" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
  <text x="700" y="445" class="arrow-label" text-anchor="middle" fill="#0072B2">reads c_t = (G_t, q_t)</text>
</svg>

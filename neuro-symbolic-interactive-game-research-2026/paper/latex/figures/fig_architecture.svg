  </g>
  <path class="connector" d="M850 282 V242" stroke="#A05A00" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" stroke-dasharray="9 6"/>
  <line class="connector" x1="689" y1="353" x2="656" y2="353" stroke="#666A6D" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <path class="connector" d="M561 424 V444 H450 V464" stroke="#666A6D" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <path class="connector" d="M689 200 H672 V262 H155 V464" stroke="#007A59" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

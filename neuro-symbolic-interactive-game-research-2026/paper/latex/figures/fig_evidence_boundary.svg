<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">TRACE-RPG evidence and inference boundary</title>
  <desc id="svg-desc">Frozen designed fixtures feed a deterministic observation pipeline and support only mechanism-conformance statements. Live-model efficacy, player benefit, affect, and commercial-engine performance remain unmeasured future questions.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#E69F00"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7A7A7A"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #202124; }
      .section { font-size: 25px; font-weight: 700; }
      .box-title { font-size: 24px; font-weight: 700; }
      .body { font-size: 21px; font-weight: 400; }
      .small { font-size: 19px; font-weight: 400; }
      .note { font-size: 19px; font-style: italic; fill: #5F6368; }
      .arrow-label { font-size: 19px; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="1440" height="650" fill="#FFFFFF"/>
  <rect x="20" y="20" width="325" height="605" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="20" y="20" width="9" height="605" fill="#7A7A7A"/>
  <text x="45" y="55" class="section" text-anchor="start">DESIGNED FIXTURES</text>
  <text x="45" y="84" class="small" text-anchor="start" fill="#5F6368">Purposive, frozen inputs</text>
  <rect x="45" y="100" width="275" height="95" rx="7" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <rect x="45" y="100" width="8" height="95" rx="4" fill="#0072B2"/>
  <text x="186" y="133" class="box-title" text-anchor="middle">Gate conformance</text>
  <text x="186" y="162" class="small" text-anchor="middle"><tspan x="186" dy="0">valid control</tspan><tspan x="186" dy="25">named failure codes</tspan></text>
  <rect x="45" y="220" width="275" height="95" rx="7" fill="#FFFFFF" stroke="#E69F00" stroke-width="2"/>
  <rect x="45" y="220" width="8" height="95" rx="4" fill="#E69F00"/>
  <text x="186" y="253" class="box-title" text-anchor="middle">Repair arms</text>
  <text x="186" y="282" class="small" text-anchor="middle"><tspan x="186" dy="0">K = 0 / retry / repair</tspan><tspan x="186" dy="25">repairable strata</tspan></text>
  <rect x="45" y="340" width="275" height="95" rx="7" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/>
  <rect x="45" y="340" width="8" height="95" rx="4" fill="#009E73"/>
  <text x="186" y="373" class="box-title" text-anchor="middle">Integrity mutations</text>
  <text x="186" y="402" class="small" text-anchor="middle"><tspan x="186" dy="0">checksum / replay</tspan><tspan x="186" dy="25">linkage / continuity</tspan></text>
  <rect x="45" y="460" width="275" height="95" rx="7" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2"/>
  <rect x="45" y="460" width="8" height="95" rx="4" fill="#7A7A7A"/>
  <text x="186" y="493" class="box-title" text-anchor="middle">Adapter + accounting</text>
  <text x="186" y="522" class="small" text-anchor="middle"><tspan x="186" dy="0">strict response classes</tspan><tspan x="186" dy="25">assignment guards</tspan></text>
  <rect x="375" y="20" width="430" height="605" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="375" y="20" width="9" height="605" fill="#0072B2"/>
  <text x="400" y="55" class="section" text-anchor="start">DETERMINISTIC OBSERVATION</text>
  <text x="400" y="84" class="small" text-anchor="start" fill="#5F6368">Versioned artifacts and exact counts</text>
  <rect x="400" y="100" width="380" height="95" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="400" y="100" width="8" height="95" rx="4" fill="#0072B2"/>
  <text x="594" y="133" class="box-title" text-anchor="middle">Frozen manifest + hashes</text>
  <text x="594" y="162" class="small" text-anchor="middle"><tspan x="594" dy="0">case IDs / arm IDs</tspan><tspan x="594" dy="25">config / input / state</tspan></text>
  <rect x="400" y="220" width="380" height="95" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="400" y="220" width="8" height="95" rx="4" fill="#0072B2"/>
  <text x="594" y="253" class="box-title" text-anchor="middle">Offline runner</text>
  <text x="594" y="282" class="small" text-anchor="middle"><tspan x="594" dy="0">proposal → gate → outcome</tspan><tspan x="594" dy="25">one classified row / case</tspan></text>
  <rect x="400" y="340" width="380" height="95" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="400" y="340" width="8" height="95" rx="4" fill="#009E73"/>
  <text x="594" y="373" class="box-title" text-anchor="middle">Designated check operations</text>
  <text x="594" y="402" class="small" text-anchor="middle"><tspan x="594" dy="0">schema + checksum</tspan><tspan x="594" dy="25">semantic replay + continuity</tspan></text>
  <rect x="400" y="460" width="380" height="95" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="400" y="460" width="8" height="95" rx="4" fill="#009E73"/>
  <text x="594" y="493" class="box-title" text-anchor="middle">Generated evidence tables</text>
  <text x="594" y="522" class="small" text-anchor="middle"><tspan x="594" dy="0">raw counts + exact ratios</tspan><tspan x="594" dy="25">no population p-values</tspan></text>
  <line x1="320" y1="147" x2="400" y2="147" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <line x1="320" y1="267" x2="400" y2="267" stroke="#E69F00" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <line x1="320" y1="387" x2="400" y2="387" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <line x1="320" y1="507" x2="400" y2="507" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <line x1="590" y1="195" x2="590" y2="220" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <line x1="590" y1="315" x2="590" y2="340" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <line x1="590" y1="435" x2="590" y2="460" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <line x1="840" y1="35" x2="840" y2="615" stroke="#E69F00" stroke-width="4" fill="none" stroke-dasharray="12 8"/>
  <text x="831" y="325" class="section" text-anchor="middle" fill="#E69F00" transform="rotate(-90 831 325)">INFERENCE BOUNDARY</text>
  <rect x="885" y="45" width="510" height="245" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="885" y="45" width="8" height="245" rx="4" fill="#009E73"/>
  <text x="1144" y="78" class="box-title" text-anchor="middle">OBSERVED IN THIS PAPER</text>
  <text x="1144" y="107" class="small" text-anchor="middle"><tspan x="1144" dy="0">Designed-fixture agreement</tspan><tspan x="1144" dy="25">Rejected-state immutability</tspan><tspan x="1144" dy="25">Bounded attempt accounting</tspan><tspan x="1144" dy="25">Implemented fault-fixture detection</tspan><tspan x="1144" dy="25">Mechanism conformance for frozen cases</tspan></text>
  <rect x="885" y="330" width="510" height="270" rx="7" fill="#FFF2DD" stroke="#E69F00" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="885" y="330" width="8" height="270" rx="4" fill="#E69F00"/>
  <text x="1144" y="363" class="box-title" text-anchor="middle">NOT MEASURED — FUTURE WORK</text>
  <text x="1144" y="392" class="small" text-anchor="middle"><tspan x="1144" dy="0">Live ten-model superiority</tspan><tspan x="1144" dy="25">Player benefit or narrative quality</tspan><tspan x="1144" dy="25">Affect-adaptation efficacy</tspan><tspan x="1144" dy="25">Commercial-engine performance</tspan><tspan x="1144" dy="25">Semantic / policy completeness</tspan><tspan x="1144" dy="25">Cryptographic authentication</tspan></text>
  <path d="M780 507 H835 V170 H885" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="823" y="141" width="105" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
  <text x="875" y="162" class="arrow-label" text-anchor="middle" fill="#009E73">supported</text>
  <text x="1140" y="625" class="note" text-anchor="middle">No result arrow crosses into the future-work panel.</text>
</svg>

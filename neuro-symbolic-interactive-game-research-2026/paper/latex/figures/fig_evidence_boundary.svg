<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">TRACE-RPG compact evidence boundary</title>
  <desc id="svg-desc">Designed fixtures flow through deterministic checks to mechanism-conformance statements only. Efficacy, player benefit, affect, and performance remain future work.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#E69F00"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7A7A7A"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #202124; }
      .section { font-size: 28px; font-weight: 700; }
      .box-title { font-size: 26px; font-weight: 700; }
      .body { font-size: 25px; font-weight: 400; }
      .small { font-size: 24px; font-weight: 400; }
      .note { font-size: 24px; font-style: italic; fill: #5F6368; }
      .arrow-label { font-size: 24px; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#FFFFFF"/>
  <rect x="15" y="15" width="245" height="525" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="15" y="15" width="9" height="525" fill="#7A7A7A"/>
  <text x="40" y="50" class="section" text-anchor="start">FROZEN FIXTURES</text>
  <text x="40" y="79" class="small" text-anchor="start" fill="#5F6368">frozen inputs</text>
  <rect x="35" y="90" width="205" height="78" rx="7" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <rect x="35" y="90" width="8" height="78" rx="4" fill="#0072B2"/>
  <text x="141" y="123" class="box-title" text-anchor="middle">Gate cases</text>
  <text x="141" y="152" class="small" text-anchor="middle"><tspan x="141" dy="0">valid + named errors</tspan></text>
  <rect x="35" y="190" width="205" height="78" rx="7" fill="#FFFFFF" stroke="#E69F00" stroke-width="2"/>
  <rect x="35" y="190" width="8" height="78" rx="4" fill="#E69F00"/>
  <text x="141" y="223" class="box-title" text-anchor="middle">Repair arms</text>
  <text x="141" y="252" class="small" text-anchor="middle"><tspan x="141" dy="0">K=0 / blind / rho / oracle</tspan></text>
  <rect x="35" y="290" width="205" height="78" rx="7" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/>
  <rect x="35" y="290" width="8" height="78" rx="4" fill="#009E73"/>
  <text x="141" y="323" class="box-title" text-anchor="middle">Faults</text>
  <text x="141" y="352" class="small" text-anchor="middle"><tspan x="141" dy="0">checksum / replay</tspan></text>
  <rect x="35" y="390" width="205" height="78" rx="7" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2"/>
  <rect x="35" y="390" width="8" height="78" rx="4" fill="#7A7A7A"/>
  <text x="141" y="423" class="box-title" text-anchor="middle">Accounting</text>
  <text x="141" y="452" class="small" text-anchor="middle"><tspan x="141" dy="0">adapter + assignment</tspan></text>
  <rect x="280" y="15" width="280" height="525" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="280" y="15" width="9" height="525" fill="#0072B2"/>
  <text x="305" y="50" class="section" text-anchor="start">DETERMINISTIC</text>
  <text x="305" y="79" class="small" text-anchor="start" fill="#5F6368">versioned exact counts</text>
  <rect x="300" y="90" width="240" height="78" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="300" y="90" width="8" height="78" rx="4" fill="#0072B2"/>
  <text x="424" y="123" class="box-title" text-anchor="middle">Manifest + hashes</text>
  <text x="424" y="152" class="small" text-anchor="middle"><tspan x="424" dy="0">IDs / config / state</tspan></text>
  <rect x="300" y="190" width="240" height="78" rx="7" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
  <rect x="300" y="190" width="8" height="78" rx="4" fill="#0072B2"/>
  <text x="424" y="223" class="box-title" text-anchor="middle">Offline runner</text>
  <text x="424" y="252" class="small" text-anchor="middle"><tspan x="424" dy="0">proposal to outcome</tspan></text>
  <rect x="300" y="290" width="240" height="78" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="300" y="290" width="8" height="78" rx="4" fill="#009E73"/>
  <text x="424" y="323" class="box-title" text-anchor="middle">Check operations</text>
  <text x="424" y="352" class="small" text-anchor="middle"><tspan x="424" dy="0">schema / continuity</tspan></text>
  <rect x="300" y="390" width="240" height="78" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="300" y="390" width="8" height="78" rx="4" fill="#009E73"/>
  <text x="424" y="423" class="box-title" text-anchor="middle">Generated tables</text>
  <text x="424" y="452" class="small" text-anchor="middle"><tspan x="424" dy="0">raw count / exact ratio</tspan></text>
  <line class="connector" x1="240" y1="129" x2="300" y2="129" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <line class="connector" x1="240" y1="229" x2="300" y2="229" stroke="#E69F00" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <line class="connector" x1="240" y1="329" x2="300" y2="329" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <line class="connector" x1="240" y1="429" x2="300" y2="429" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)"/>
  <line class="connector" x1="585" y1="25" x2="585" y2="535" stroke="#E69F00" stroke-width="4" fill="none" stroke-dasharray="11 7"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="561" y="130" width="48" height="300" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="585" y="280" class="section" text-anchor="middle" fill="#E69F00" transform="rotate(-90 585 280)">INFERENCE BOUNDARY</text>
  </g>
  <rect x="615" y="35" width="270" height="235" rx="7" fill="#E8F5EF" stroke="#009E73" stroke-width="2"/>
  <rect x="615" y="35" width="8" height="235" rx="4" fill="#009E73"/>
  <text x="754" y="68" class="box-title" text-anchor="middle">OBSERVED</text>
  <text x="754" y="97" class="small" text-anchor="middle"><tspan x="754" dy="0">fixture agreement</tspan><tspan x="754" dy="25">state immutability</tspan><tspan x="754" dy="25">attempt accounting</tspan><tspan x="754" dy="25">guided/oracle split</tspan><tspan x="754" dy="25">named fault detection</tspan><tspan x="754" dy="25">mechanism conformance</tspan></text>
  <rect x="615" y="295" width="270" height="235" rx="7" fill="#FFF2DD" stroke="#E69F00" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="615" y="295" width="8" height="235" rx="4" fill="#E69F00"/>
  <text x="754" y="328" class="box-title" text-anchor="middle">NOT MEASURED</text>
  <text x="754" y="357" class="small" text-anchor="middle"><tspan x="754" dy="0">live repair superiority</tspan><tspan x="754" dy="25">player or narrative benefit</tspan><tspan x="754" dy="25">affect efficacy</tspan><tspan x="754" dy="25">commercial performance</tspan><tspan x="754" dy="25">semantic completeness</tspan><tspan x="754" dy="25">authentication</tspan></text>
  <path class="connector" d="M540 429 H570 V270 H750" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <g class="connector-label" data-line-clearance="shielded">
    <rect class="label-shield" x="616" y="265" width="98" height="29" rx="2" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="665" y="286" class="arrow-label" text-anchor="middle" fill="#009E73">supports</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">v5 paired-selector collection flow and per-fixture outcomes</title>
  <desc id="svg-desc">Assigned, received, strictly parsed, gate-accepted and objective-reached counts include all twenty assignments. Matrix letters identify goal, accepted but goal missed, fallback or schema failure. Seconds include every terminal response, including schema failures, and measure dispatch to terminal, not model latency. The four rows report parsed/gate/goal counts out of five assigned cases each. Served identity, provider request count and cost are not reported. Error codes: missing_precondition: POLICY_PRECONDITION_OMISSION; missing_effect: POLICY_EFFECT_OMISSION; unauthorized_objective: POLICY_EFFECT_VIOLATION; forbidden_disclosure: FORBIDDEN_DISCLOSURE; unsatisfied_dependency: UNSATISFIED_PRECONDITION</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A05A00"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#007A59"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#666A6D"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #202124; }
      .section { font-size: 32px; font-weight: 700; }
      .box-title { font-size: 30px; font-weight: 700; }
      .body { font-size: 29px; font-weight: 400; }
      .small { font-size: 28px; font-weight: 400; }
      .note { font-size: 28px; font-style: italic; fill: #5F6368; }
      .arrow-label { font-size: 28px; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="1440" height="1120" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1400" height="80" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="20" y="20" width="9" height="80" fill="#007A59"/>
  <text x="45" y="55" class="section" text-anchor="start">V5 DEVELOPMENT COLLECTION | 20 ASSIGNMENTS</text>
  <text x="45" y="84" class="small" text-anchor="start" fill="#5F6368">Five synthetic fixtures x two signal conditions x two requested selectors; no pooled prior cohort.</text>

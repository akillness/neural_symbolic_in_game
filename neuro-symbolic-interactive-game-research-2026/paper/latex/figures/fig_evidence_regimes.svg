<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="468" viewBox="0 0 900 468" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">TRACE-RPG evidence regime contrast</title>
  <desc id="svg-desc">Descriptive raw counts only: E1 frozen offline repair arms use twelve cases per arm; E2 screening-pilot-only matched candidates show the Signal-v2 policy-blind contrast and a goal-directed null regime. Denominators are not pooled and the figure supports no population efficacy, model ranking, or player-experience inference.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A05A00"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#007A59"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#666A6D"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #202124; }
      .section { font-size: 32px; font-weight: 700; }
      .box-title { font-size: 30px; font-weight: 700; }
      .body { font-size: 29px; font-weight: 400; }
      .small { font-size: 28px; font-weight: 400; }
      .note { font-size: 28px; font-style: italic; fill: #5F6368; }
      .arrow-label { font-size: 28px; font-weight: 700; }
    </style>
  </defs>
  <style> .evidence-label { font-size: 28px; font-weight: 700; } .panel-title { font-size: 28px; font-weight: 700; } .evidence-value { font-size: 28px; font-weight: 700; } .evidence-tiny { font-size: 28px; font-weight: 400; } .evidence-note { font-size: 28px; font-style: italic; fill: #5F6368; }</style>
  <rect x="0" y="0" width="900" height="468" fill="#FFFFFF"/>
  <rect x="10" y="10" width="880" height="450" rx="5" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="10" y="10" width="9" height="450" fill="#0072B2"/>
  <text x="35" y="45" class="section" text-anchor="start">EVIDENCE REGIME CONTRAST (RAW COUNTS ONLY)</text>
  <text x="35" y="78" class="evidence-note" text-anchor="start">E1 offline + E2 screening-pilot-only; no inference</text>
  <rect x="25" y="95" width="420" height="300" rx="5" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="42" y="127" class="panel-title" text-anchor="start" fill="#0072B2">E1  FROZEN OFFLINE</text>
  <text x="42" y="166" class="evidence-tiny" text-anchor="start" fill="#5F6368">initially invalid: n=12</text>
  <text x="193" y="201" class="evidence-label" text-anchor="end">Reject-only</text>
  <rect x="190" y="181" width="165" height="24" rx="3" fill="#EEF0F2" stroke="#C9CDD1" stroke-width="2"/>
  <text x="365" y="202" class="evidence-value" text-anchor="start">0/12</text>
  <text x="193" y="246" class="evidence-label" text-anchor="end">Blind retry</text>
  <rect x="190" y="226" width="165" height="24" rx="3" fill="#EEF0F2" stroke="#C9CDD1" stroke-width="2"/>
  <text x="365" y="247" class="evidence-value" text-anchor="start">0/12</text>
  <text x="193" y="291" class="evidence-label" text-anchor="end">Guided ρ</text>
  <rect x="190" y="271" width="165" height="24" rx="3" fill="#EEF0F2" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="190" y="271" width="69" height="24" rx="3" fill="#A05A00" stroke="#A05A00" stroke-width="2"/>
  <text x="365" y="292" class="evidence-value" text-anchor="start">5/12</text>
  <text x="193" y="336" class="evidence-label" text-anchor="end">State oracle</text>
  <rect x="190" y="316" width="165" height="24" rx="3" fill="#EEF0F2" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="190" y="316" width="82" height="24" rx="3" fill="#007A59" stroke="#007A59" stroke-width="2"/>
  <text x="365" y="337" class="evidence-value" text-anchor="start">6/12</text>
  <text x="190" y="380" class="evidence-tiny" text-anchor="middle" fill="#5F6368">0</text>
  <text x="272" y="380" class="evidence-tiny" text-anchor="middle" fill="#5F6368">6</text>
  <text x="355" y="380" class="evidence-tiny" text-anchor="middle" fill="#5F6368">12</text>
  <rect x="460" y="95" width="420" height="300" rx="5" fill="#FFFFFF" stroke="#A05A00" stroke-width="2"/>
  <text x="477" y="127" class="panel-title" text-anchor="start" fill="#A05A00">E2  SCREENING-PILOT-ONLY</text>
  <text x="477" y="166" class="evidence-tiny" text-anchor="start" fill="#5F6368">matched calls: 5/cell</text>
  <rect x="475" y="173" width="390" height="105" rx="4" fill="#FFF2DD" stroke="#A05A00" stroke-width="2"/>
  <text x="489" y="198" class="evidence-label" text-anchor="start">Signal-v2 / policy-blind</text>
  <rect x="570" y="216" width="170" height="19" rx="3" fill="#FFFFFF" stroke="#C9CDD1" stroke-width="2"/>
  <rect x="570" y="216" width="170" height="19" rx="3" fill="#A05A00" stroke="#A05A00" stroke-width="2"/>
  <text x="752" y="233" class="evidence-value" text-anchor="start">5/5</text>
  <rect x="570" y="249" width="170" height="19" rx="3" fill="#FFFFFF" stroke="#C9CDD1" stroke-width="2"/>
  <text x="752" y="266" class="evidence-value" text-anchor="start">0/5</text>
  <rect x="475" y="282" width="390" height="105" rx="4" fill="#EEF0F2" stroke="#666A6D" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="489" y="307" class="evidence-label" text-anchor="start">goal-directed / null</text>
  <rect x="570" y="325" width="170" height="19" rx="3" fill="#FFFFFF" stroke="#C9CDD1" stroke-width="2"/>
  <text x="752" y="342" class="evidence-value" text-anchor="start">0/5</text>
  <rect x="570" y="358" width="170" height="19" rx="3" fill="#FFFFFF" stroke="#C9CDD1" stroke-width="2"/>
  <text x="752" y="375" class="evidence-value" text-anchor="start">0/5</text>
  <line class="connector" x1="450" y1="95" x2="450" y2="395" stroke="#C9CDD1" stroke-width="2" fill="none"/>
  <text x="477" y="417" class="evidence-tiny" text-anchor="start" fill="#5F6368">rho = guided; blind = unchanged</text>
  <text x="477" y="450" class="evidence-note" text-anchor="start">Denominators separate.</text>
</svg>

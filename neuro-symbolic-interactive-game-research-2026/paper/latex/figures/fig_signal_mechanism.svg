<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" role="img" aria-labelledby="svg-title svg-desc" data-paper-label="fig:signal-mechanism">
<title id="svg-title">TRACE-RPG source-bound ontology mechanism</title>
<desc id="svg-desc">Eight roles from ontology-map.json connect scenario and frozen expectation sources to relations and constraints, actual recorded checks, a bounded decision and canonical state effect. This is an explicit authored ontology, not hidden model state or a seven-dimensional embedding. Python Boolean checks, Godot display families and disclosure rules remain separate vocabularies. Missing checks are unreported, never passed.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#202124}.title{font-size:34px;font-weight:700}.subtitle{font-size:28px;fill:#5F6368}.head{font-size:32px;font-weight:700}.body{font-size:30px}.small{font-size:28px;fill:#5F6368}.label{font-size:30px;font-weight:700}.cell{font-size:30px}.note{font-size:28px;font-style:italic;fill:#5F6368}</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#0072B2"/></marker></defs>
<rect width="1280" height="1060" fill="#FFFFFF"/>
<rect x="20" y="16" width="600" height="252" rx="8" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
<text x="320" y="70" class="head" text-anchor="middle">SOURCE + TYPED REQUEST</text>
<text x="320" y="120" class="body" text-anchor="middle">scenario + frozen expectations</text>
<text x="320" y="158" class="body" text-anchor="middle">reveal_hint(actor_id, fact_id)</text>
<rect x="660" y="16" width="600" height="252" rx="8" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
<text x="960" y="70" class="head" text-anchor="middle">EIGHT ONTOLOGY ROLES</text>
<text x="960" y="120" class="body" text-anchor="middle">World declares Actor / Fact / Quest</text>
<text x="960" y="158" class="body" text-anchor="middle">Knowledge links Actor to Fact</text>
<text x="960" y="196" class="body" text-anchor="middle">Policy constrains Action</text>
<text x="960" y="234" class="body" text-anchor="middle">Trace records checks and effects</text>
<rect x="660" y="316" width="600" height="252" rx="8" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
<text x="960" y="370" class="head" text-anchor="middle">RELATIONS / CONSTRAINTS</text>
<text x="960" y="420" class="body" text-anchor="middle">actor knows fact; fact disclosed</text>
<text x="960" y="458" class="body" text-anchor="middle">forbidden / minimum quest stage</text>
<text x="960" y="496" class="body" text-anchor="middle">knowledge or history ≠ permission</text>
<rect x="20" y="316" width="600" height="252" rx="8" fill="#FFF2DD" stroke="#A05A00" stroke-width="2"/>
<text x="320" y="370" class="head" text-anchor="middle">ACTUAL RECORDED CHECKS</text>
<text x="320" y="420" class="body" text-anchor="middle">policy / actor / knowledge</text>
<text x="320" y="458" class="body" text-anchor="middle">stage gate + state-effect rules</text>
<text x="320" y="496" class="body" text-anchor="middle">only emitted checks shown</text>
<rect x="20" y="616" width="600" height="252" rx="8" fill="#FBECEC" stroke="#B54747" stroke-width="2"/>
<text x="320" y="670" class="head" text-anchor="middle">DECISION</text>
<text x="320" y="720" class="body" text-anchor="middle">authorized fresh /</text>
<text x="320" y="758" class="body" text-anchor="middle">authorized redisplay / denied</text>
<rect x="660" y="616" width="600" height="252" rx="8" fill="#EEF0F2" stroke="#666A6D" stroke-width="2"/>
<text x="960" y="670" class="head" text-anchor="middle">CANONICAL STATE EFFECT</text>
<text x="960" y="720" class="body" text-anchor="middle">fresh: add fact + disclosed ID</text>
<text x="960" y="758" class="body" text-anchor="middle">tide_marks_hint only: relationship memory</text>
<text x="960" y="796" class="body" text-anchor="middle">redisplay / denial: no mutation</text>
<text x="960" y="834" class="body" text-anchor="middle">quest stage preserved</text>
<path class="connector" d="M626,142 H654" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path class="connector" d="M960,274 V310" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path class="connector" d="M654,442 H626" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path class="connector" d="M320,574 V610" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path class="connector" d="M626,742 H654" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="640" y="922" class="small" text-anchor="middle">Roles: ontology-map.json</text>
<text x="640" y="960" class="small" text-anchor="middle">7 Python checks | 6 Godot families | 7 DISC rules</text>
<text x="640" y="998" class="small" text-anchor="middle">Missing checks: unreported, not pass</text>
<text x="640" y="1036" class="small" text-anchor="middle">Authored structure, not model state</text>
</svg>

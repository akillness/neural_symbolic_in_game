<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="908" viewBox="0 0 640 908" role="img" aria-labelledby="svg-title svg-desc" data-paper-label="fig:signal-mechanism">
<title id="svg-title">TRACE-RPG semantic mechanism</title>
<desc id="svg-desc">Typed input flows through semantic entities, relations, rules and recorded checks to a bounded decision and canonical state effect. Runtime policy remains separate from authored methods ontology simulation. Python Boolean checks, Godot display families and frozen disclosure rules are distinct vocabularies; absent coverage is unreported, never passed, skipped or out of scope.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#202124}.title{font-size:34px;font-weight:700}.subtitle{font-size:28px;fill:#5F6368}.head{font-size:32px;font-weight:700}.body{font-size:30px}.small{font-size:28px;fill:#5F6368}.label{font-size:30px;font-weight:700}.cell{font-size:30px}.note{font-size:28px;font-style:italic;fill:#5F6368}</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#0072B2"/></marker></defs>
<rect width="640" height="908" fill="#FFFFFF"/>
<rect x="20" y="12" width="600" height="134" rx="8" fill="#EAF4FA" stroke="#0072B2" stroke-width="2"/>
<text x="320" y="50" class="head" text-anchor="middle">TYPED INPUT</text>
<text x="320" y="90" class="body" text-anchor="middle">operation / role / subject /</text>
<text x="320" y="124" class="body" text-anchor="middle">stage / booleans</text>
<path class="connector" d="M320,148 L320,172" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="20" y="178" width="600" height="134" rx="8" fill="#E8F5EF" stroke="#007A59" stroke-width="2"/>
<text x="320" y="216" class="head" text-anchor="middle">ONTOLOGY</text>
<text x="320" y="256" class="body" text-anchor="middle">entities / knowledge /</text>
<text x="320" y="290" class="body" text-anchor="middle">disclosed relations / rules</text>
<path class="connector" d="M320,314 L320,338" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="20" y="344" width="600" height="134" rx="8" fill="#FFF2DD" stroke="#A05A00" stroke-width="2"/>
<text x="320" y="382" class="head" text-anchor="middle">ACTUAL CHECKS</text>
<text x="320" y="422" class="body" text-anchor="middle">policy / actor / knowledge /</text>
<text x="320" y="456" class="body" text-anchor="middle">stage / template</text>
<path class="connector" d="M320,480 L320,504" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="20" y="510" width="600" height="134" rx="8" fill="#FBECEC" stroke="#B54747" stroke-width="2"/>
<text x="320" y="548" class="head" text-anchor="middle">DECISION</text>
<text x="320" y="588" class="body" text-anchor="middle">authorized fresh /</text>
<text x="320" y="622" class="body" text-anchor="middle">authorized redisplay / denied</text>
<path class="connector" d="M320,646 L320,670" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="20" y="676" width="600" height="134" rx="8" fill="#EEF0F2" stroke="#666A6D" stroke-width="2"/>
<text x="320" y="714" class="head" text-anchor="middle">STATE EFFECT</text>
<text x="320" y="754" class="body" text-anchor="middle">fresh disclosure;</text>
<text x="320" y="788" class="body" text-anchor="middle">redisplay or denial: no mutation</text>
<text x="320" y="850" class="body" text-anchor="middle">Absent checks = unreported,</text>
<text x="320" y="886" class="body" text-anchor="middle">not passed.</text>
</svg>

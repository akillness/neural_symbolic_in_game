<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="468" viewBox="0 0 1100 468" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">NPC-SCR1 fixed-case trace outcomes</title>
<desc id="svg-desc">Observed completed traces and retained assigned failures for 24 rows per arm in authored fixed cases, including Codex-backed P. These descriptive counts are not estimates of recovery efficacy. O is a protocol-declared auxiliary; actual model-family matching is unverified.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#202124}.title{font-size:32px;font-weight:700}.label{font-size:30px;font-weight:700}.body{font-size:28px}.note{font-size:28px;fill:#5F6368}.connector{fill:none}</style>
<rect width="1100" height="468" fill="white"/>
<text x="40" y="48" class="title">NPC-SCR1 | FIXED-CASE TRACE OUTCOMES</text>
<text x="40" y="90" class="note">P: Codex intent | R: authored rules | O: protocol auxiliary (family unverified)</text>
<rect x="145" y="115" width="25" height="22" fill="#0072B2"/>
<text x="183" y="135" class="note">Completed trace</text>
<rect x="470" y="115" width="25" height="22" fill="#D55E00"/>
<text x="508" y="135" class="note">Assigned failure (retained)</text>
<text x="70" y="193" class="label">P</text>
<rect class="bar completed" x="145" y="165" width="450" height="34" fill="#0072B2"/>
<rect class="bar assigned-failure" x="595" y="165" width="90" height="34" fill="#D55E00"/>
<line class="connector" x1="685" y1="182" x2="705" y2="182" stroke="#C9CDD1" stroke-width="2"/>
<text x="715" y="193" class="body">20 complete / 4 failed</text>
<text x="70" y="258" class="label">R</text>
<rect class="bar completed" x="145" y="230" width="450" height="34" fill="#0072B2"/>
<rect class="bar assigned-failure" x="595" y="230" width="90" height="34" fill="#D55E00"/>
<line class="connector" x1="685" y1="247" x2="705" y2="247" stroke="#C9CDD1" stroke-width="2"/>
<text x="715" y="258" class="body">20 complete / 4 failed</text>
<text x="70" y="323" class="label">O</text>
<rect class="bar completed" x="145" y="295" width="450" height="34" fill="#0072B2"/>
<rect class="bar assigned-failure" x="595" y="295" width="90" height="34" fill="#D55E00"/>
<line class="connector" x1="685" y1="312" x2="705" y2="312" stroke="#C9CDD1" stroke-width="2"/>
<text x="715" y="323" class="body">20 complete / 4 failed</text>
<text x="40" y="389" class="note">Goal reached, fixed cases only | P: 4/24 | R: 4/24 | O: 4/24</text>
<text x="40" y="427" class="note">Independent-source rows: 0. No efficacy, superiority, or generalization claim.</text>
</svg>

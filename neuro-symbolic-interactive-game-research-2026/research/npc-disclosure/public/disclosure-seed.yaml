goal: 논문내용을 깊이있게 발전시켜보자. 논문은 한글/영어 동시업데이트하고, 게임도 영향을 주는 부분은 같이 개선해야해.
task_type: code
brownfield_context:
  project_type: brownfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
- subagent 이용해. api jev 이용해.
- 보존하고 관련 항목만 수정
- '- 이 보장 범위는 선언된 사실·허가 규칙·승인된 템플릿의 폐쇄된 표시 경로에 한정한다. 자연어 전체의 암묵적 함의, 우회적 추론, 모든 UI
  채널의 정보 유출 방지를 증명한 것으로 확대하지 않는다.'
- '- 구조화된 오류 제공에 따른 수리 효과의 별도 인과 실험은 선택하지 않았다. 온톨로지 우월성, 사람의 개발 시간 단축, 일반화는 이 선택으로
  확정되는 결과가 아니다.'
- '- 이 단계의 근거는 규칙 준수·추적성·규칙 변경 누락에 대한 제한된 공학 검증이다. 별도 에이전트의 작성만으로 독립 인간 정답, 접근이 분리된
  holdout 또는 사람의 이득이 성립하지 않는다. Jev는 보조 검토이며 정답·커밋 권한을 갖지 않는다.'
- '**사용자 확정 답변 (2026-10-22 세션, 질문 도구): ① 게임 속 NPC·상태·행동.** 코딩 에이전트는 제작 출처로 구분하고, 모델
  내부 잠재 상태 측정은 이번 주 연구 대상에서 제외한다. 이 선택은 온톨로지 런타임 연결·새 효능 주장·구현 착수의 승인이 아니다.'
- '**두 번째 사용자 확정 답변 (질문 도구): ② 한정된 실행 계약.** 선정한 행동 범위의 온톨로지 관계·정책을 실제 게임 검증에 연결하고,
  계약→검사→오류·수리→상태 전이의 근거를 한·영 논문에 함께 반영하는 방향을 선택했다. 현 레지스트리가 이미 실행 권위를 가진다는 뜻이 아니다.
  행동 범위·중심 연구 주장·비교 조건·성공 기준은 인터뷰에서 추가 결정하며, 아직 코드·원고 구현에 착수하지 않았다.'
- '**세 번째 사용자 확정 답변 (질문 도구): 선언된 규칙의 집행·추적.** 핵심 검증 대상은 금지된 상태 변경 차단과 온톨로지 계약→검사→오류·수리→실제
  게임 상태 변경의 재현이다. 구조화 오류의 수리 효능이나 행동 간 일반화는 이번 선택으로 입증된 것이 아니며, 핵심 주장으로 선택되지 않았다.
  첫 대상 행동과 성공 기준은 아직 정하지 않았고, 한·영 원고 및 게임 코드 구현은 아직 시작하지 않았다.'
- '- **네 번째 사용자 확정 답변 (질문 도구): ② NPC 정보 공개.** 첫 검증 행동은 `reveal_hint` 정보 공개로 한정한다.
  아이템 거래·퀘스트 단계 변경으로의 일반화는 이 선택에 포함하지 않는다.'
- '- 사용자 확정 답변(질문 도구): **허가된 사실만 대사로 표시**. 공개 기록 변경만 통제하는 방식이나 자유 생성 대사에 의미 판정기를 붙이는
  방식은 이번 첫 연결의 선택이 아니다.'
- '- 선택한 범위는 canonical fact ID와 검증된 정형 템플릿으로 플레이어 대사를 구성하고, 허가되지 않은 사실이 공개 상태나 표시
  대사에 들어가지 않는지 함께 검증하는 것이다. 표현 자유도는 제한한다.'
- '- 사용자 확정 답변(질문 도구): **일반 규칙 구현까지 비교**. 동일 상태·후보 사실·표시 템플릿을 제공하는 무검사, 일반 타입/명시적
  정책 코드, 온톨로지 기반 게이트의 세 비교군을 포함한다. 무검사 비교군은 격리된 평가에서만 실행한다.'
- '- 사용자 확정 답변(질문 도구): **규칙 기반 검증부터 완성**. 별도 검증 subagent가 선언된 규칙에서 사례별 기대 판정표를 작성하고
  구현 전에 동결하는 방식을 선택했다.'
- '- 사용자 확정 답변(질문 도구): **현 시나리오 조건 전수**. 새 NPC나 스토리를 추가하지 않고 현재 선언된 사실·공개 정책·퀘스트 단계와
  행위자 적격성·지식 보유·기공개 여부의 유한 조건표를 검증한다. 경계·잘못된 입력 사례는 별도 층으로 구분한다.'
- '- 사용자 확정 답변(질문 도구): **대사만 다시 표시**. 이미 공개한 사실을 다시 요청받으면 현재 공개 조건을 재검사한다. 여전히 허용되는
  경우 정형 대사는 다시 표시하되 `facts`, NPC `disclosed`, 관계 기억, `revision`과 canonical state hash는
  바꾸지 않는다. 요청과 판정은 canonical 게임 상태 밖의 추적에 남긴다.'
- '- 기공개 이력은 권한 우회가 아니다. 현재 영구 금지·단계·행위자·지식 조건을 통과하지 못하면 재표시도 거부한다. 이 선택은 앞으로 구현할
  계약이며 현재 런타임이 멱등하다는 관측 결과가 아니다.'
acceptance_criteria:
- description: '- 같은 규칙을 정확히 구현한 두 게이트는 같은 판정을 해야 한다. 위반률만으로 온톨로지의 추가 기여를 주장하지 않는다.
    동일 규칙 판정 일치와 규칙 변경 시 수정 범위·누락·추적성을 함께 측정한다.'
  semantic_ac_key: ac_9463c0c646f414f3
- description: '- 기대값은 온톨로지 게이트의 출력에서 복사하지 않는다. 세 비교군에 동일한 사례와 기대값을 적용하고, 무검사군의 위반은
    관측값으로 보고한다.'
  semantic_ac_key: ac_ff288501aeb5ac43
- description: '- 사례 수와 분모는 선언에서 산출하여 구현 전에 동결한다. ‘전수’는 이 선언 조건표에만 적용하며 모든 도달 가능한
    게임 상태, 자유 자연어, 다른 행동이나 게임의 일반화로 확대하지 않는다.'
  semantic_ac_key: ac_b015e6c607e3886c
- description: '- 질문에 제시한 수용 기준: 두 게이트는 동결된 모든 사례의 기대 허용·거부 판정과 일치한다. 거부 시 공개 상태와
    플레이어 대사에 금지 사실을 추가하지 않는다. 계약 버전·규칙 ID·검사·오류·상태 변경을 연결한다. 같은 초기 상태·계약·후보의 재생은 판정·공개
    상태·표시 대사가 동일해야 한다.'
  semantic_ac_key: ac_301ac91c731c5625
- description: '- 세 비교군은 같은 사례·기대값을 사용한다. 의도적인 무검사군에는 무위반 통과를 요구하지 않고 실제 위반 수를 기록한다.
    일반 코드와 온톨로지 게이트에는 같은 규칙 변경을 적용하고 수정 범위·누락을 보고한다.'
  semantic_ac_key: ac_24d8aed5f1841948
- description: '- 별도 검증 subagent의 기대표 동결, Jev의 보조 의견 경계, 독립 인간 정답·접근 분리 holdout·인간
    이득을 주장하지 않는 조건은 유지한다. 구체적 규칙 변경 fixture와 개수는 선언을 근거로 정해 같은 동결 패킷에 포함해야 한다.'
  semantic_ac_key: ac_28de097b1d4a9f0b
- description: '- 사용자 확정 답변(질문 도구): **대사만 다시 표시**. 이미 공개한 사실을 다시 요청받으면 현재 공개 조건을 재검사한다.
    여전히 허용되는 경우 정형 대사는 다시 표시하되 `facts`, NPC `disclosed`, 관계 기억, `revision`과 canonical
    state hash는 바꾸지 않는다. 요청과 판정은 canonical 게임 상태 밖의 추적에 남긴다.'
  semantic_ac_key: ac_3ebb7342ed5829b4
- description: '- 기공개 이력은 권한 우회가 아니다. 현재 영구 금지·단계·행위자·지식 조건을 통과하지 못하면 재표시도 거부한다. 이
    선택은 앞으로 구현할 계약이며 현재 런타임이 멱등하다는 관측 결과가 아니다.'
  semantic_ac_key: ac_9018dbc6d617c3ea
- description: >-
    완료 증거 묶음에는 다음 여섯 항목을 갖춘 유한 산출물 명세와 실제 산출물이 있어야 한다:
    (1) 동결된 계약에서 확인되는 온톨로지 문서의 구조·내용,
    (2) Python 구성과 Godot 실행의 역할·연결 및 분리 경계 설명,
    (3) 시그널 시각자료·범례·의미,
    (4) 세 비교군의 근거 기반 비교표,
    (5) 한글·영어 원고 동시 개정,
    (6) reveal_hint 게임 변경과 검증 사례의 대응표.
    각 항목은 규칙·소스 근거, 산출물 경로, 한글·영어 원고 위치,
    해당 게임·fixture 영향 또는 비적용 사유와 확인 명령·관측 결과에 연결한다.
    그림은 원자료에, 표의 수치·분모는 동결된 사례와 실제 실행 기록에 연결하며
    시그널을 모델 내부 잠재 상태 측정으로 표현하지 않는다.
    한글·영어의 주장·표·그림 ID와 수치는 일치해야 한다.
    기존 여덟 동작 기준과 아홉 결정을 유지하고 새 NPC·스토리·실험군을 추가하지 않는다.
    추가 실험이나 효능 주장을 요구하지 않으며 미지원 주장은 주장하지 않음으로 표시한다.
    이 표시는 필수 산출물 미완료를 면제하지 않는다.
  semantic_ac_key: ac_5ec891277d116f3c

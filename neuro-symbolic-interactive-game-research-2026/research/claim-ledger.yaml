  - id: C-GAME-DESIGN-002
    claim: The engine-local Godot evidence comprises four authored fixtures. The canonical, duplicate-ID, and timeout fixtures completed their declared multi-step, failure-isolation, save/load, operation-replay, and terminal/reference-hash checks; the corrupt-save fixture separately verified rejection without canonical-state mutation. A stable-envelope projection test exists, but live Python authorization transport remains unexecuted.
    evidence:

claims:
  - id: C-METHOD-001
    claim: LLM proposals can be incrementally grounded by symbolic validation for playable IF world generation.
    evidence: [ivie-2026]
    status: verified-scope-limited
  - id: C-METHOD-002
    claim: The benefit of symbolic dialogue scaffolding can depend on NPC role and does not universally improve player experience.
    evidence: [scaffolded-play-2025]
    status: verified-scope-limited
  - id: C-DATA-001
    claim: KNUDGE evaluates branching NPC dialogue against quest and entity specifications from The Outer Worlds.
    evidence: [knudge-2022]
    status: verified-primary
  - id: C-AFFECT-001
    claim: A recent 2026 preprint reports a perception-understanding gap for engagement inference in the games it evaluates.
    evidence: [gamevibe-vlm-2026]
    status: verified-scope-limited-preprint
  - id: C-SYSTEM-001
    claim: TRACE-RPG treats encoded hard predicates as a pre-commit gate while narrative, affect, retrieval, and memory signals remain non-authoritative proposal context.
    evidence: [ivie-2026]
    status: proposed-contribution
    audit_binding_scope: >-
      C3 is an audit-binding contribution, not a measured traceability improvement:
      the versioned world/actor/knowledge/fact/policy/quest/action/trace roles connect
      declared rule checks, emitted decisions, observed state effects, and replay
      records without granting proposal context canonical-state authority. In the
      authored NPC-DISC-1 packet, general-rule and ontology gates agree on 60/60
      outcomes under the same frozen rules, with zero recorded expectation, state,
      display, or replay mismatches in either arm. This is bounded decision parity
      without observed fixture regression, not ontology necessity or superiority.
      TR01-TR06 remains PROPOSED_NOT_VALIDATED with no measured current-case score;
      neither 360/360 nor 120/360 binding completeness is established. The canonical
      rubric defines TR03 as decision-to-effect correspondence and TR05 as separate
      forward/reverse requirement coverage, and prohibits a combined six-dimension
      score. Eight role declarations are not six independently scored dimensions.
    audit_binding_sources:
      - game-track/web/dashboard/ontology-map.json
      - research/npc-disclosure/results-current/comparison-summary.json
      - research/traceability-scoring-20261023/rubric.json
      - research/traceability-scoring-20261023/contribution-assessment.en.md
      - research/traceability-scoring-20261023/contribution-assessment.ko.md
  - id: C-PILOT-001
    claim: In the authored Stage 4 fixtures, the loader-enforced set covered all 12 implemented error codes and observed outcomes matched 13/13 authored expectations; this is authored-oracle conformance, not an independent success rate.
    evidence:
      - research/academic-pipeline/stage-04-pilot/pilot-results.json
      - research/academic-pipeline/stage-04-pilot/sha256-manifest.json
    status: verified-designed-fixture
  - id: C-PILOT-002
    claim: Across the 12 authored initially-invalid repair cases at matched budget K=1, rejection-only committed 0/12 and unchanged retry committed 0/12, while counterexample-guided repair committed 5/12 and the state-reading policy-restore oracle committed 6/12; every non-committing arm left the prior state hash unchanged.
    evidence:
      - research/academic-pipeline/stage-04-pilot/pilot-results.json
      - research/academic-pipeline/stage-04-pilot/repair-arms.csv
      - research/academic-pipeline/stage-04-pilot/repair-arm-summary.csv
    status: verified-designed-fixture
  - id: C-PILOT-006
    claim: Per frozen repairability class, guided repair committed 5/5 guided_repairable, 0/1 oracle_only, and 0/6 irreparable, while the oracle arm additionally committed the single oracle_only case; guided commits used a mean changed-field edit distance of 1.0. This separates model-free counterexample repair from state-reading repair on authored fixtures and is not a live-model repair-quality result.
    evidence:
      - research/academic-pipeline/stage-04-pilot/repair-class-summary.csv
      - research/academic-pipeline/stage-04-pilot/pilot-results.json
    status: verified-designed-fixture
  - id: C-PILOT-003
    claim: All 10 faults prespecified as detectable were rejected by their designated operations without detector-layer attribution, while substitution of a different invalid precursor before the same valid repair was replay-accepted 1/1 as the separately declared provenance boundary.
    evidence:
      - research/academic-pipeline/stage-04-pilot/pilot-results.json
      - research/academic-pipeline/stage-04-pilot/integrity-faults.csv
      - research/academic-pipeline/stage-04-pilot/integrity-boundaries.csv
    status: verified-designed-fixture
    scope_note: >-
      C3 supports inspection of named rule/check/decision/effect and replay bindings
      within the declared integrity boundary. The separate NPC-DISC-1 comparison
      records 60/60 equal general-rule/ontology outcomes with no observed fixture
      regression; it does not independently score TR01-TR06 or establish that an
      ontology improves decisions, traceability, repair, or player outcomes.
    audit_binding_sources:
      - research/npc-disclosure/results-current/comparison-summary.json
      - research/traceability-scoring-20261023/rubric.json
  - id: C-PILOT-004
    claim: The seven authored adapter/accounting assignments yielded 1 commit, 1 symbolic fallback, and 5 adapter failures, and all 3 injected assignment guards rejected.
    evidence:
      - research/academic-pipeline/stage-04-pilot/pilot-results.json
      - research/academic-pipeline/stage-04-pilot/adapter-accounting.csv
      - research/academic-pipeline/stage-04-pilot/accounting-guards.csv
    status: verified-designed-fixture
  - id: C-PILOT-005
    claim: The frozen Stage 4 manifest binds 121 provenance records (85 executed fixture rows and 36 aggregate rows), including the closed unknown-key regression and fault-specific input specifications, and the tracked release records its input and artifact checksums.
    evidence:
      - research/academic-pipeline/stage-04-pilot/pilot-assignment-manifest.json
      - research/academic-pipeline/stage-04-pilot/sha256-manifest.json
    status: verified-designed-fixture
    reconciliation_note: "2026-10-14 bounded refresh confirms the tracked Stage-04 manifest remains authoritative at 121 = 85 executed + 36 aggregate; pilot-assignment-manifest.json and sha256-manifest.json are hash-bound and unchanged. Later 64 = 43 + 21 prose/material-passport counts are retained only as a separate historical recapture claim and do not replace this ledger evidence."
  - id: C-GAME-DESIGN-001
    claim: The approved Sealed Lighthouse protocol separates a structured-state/text primary track from a frozen-image VLM/UI secondary track, with image generation prohibited during experiment execution.
    evidence:
      - configs/experimental-game.yaml
      - game-track/assets/concepts/asset-manifest.json
      - ../.omx/specs/deep-interview-experimental-game-track.md
    status: approved-design-protocol
  - id: C-GAME-DESIGN-002
    claim: The legacy ENG1 engine-local Godot evidence comprises four authored fixtures. The canonical, duplicate-ID, and timeout fixtures completed their declared multi-step, failure-isolation, save/load, operation-replay, and terminal/reference-hash checks; the corrupt-save fixture separately verified rejection without canonical-state mutation. Its stable-envelope projection test does not execute the core Python hard-policy authorization transport. The separate Godot-authoritative NPC v1.1.0/native012 intent-planning path is outside this claim.
    evidence:
      - configs/experimental-game.yaml
      - research/academic-pipeline/stage-06-peer-review-simulation.md
      - _workspace/current/engineering/tech-verification/godot-headless.md
      - _workspace/current/engineering/tech-verification/current.json
    status: verified-authored-engine-fixture
  - id: C-GAME-DESIGN-003
    claim: In the retained Godot 4.7.1 render packet, three non-headless 1280x720 primary-track PNGs are content-hashed and bound to canonical scripted-fixture event IDs, delivery indices, validation outcomes, and before/after world-state hashes; this establishes authored engine render/state correspondence only, not live Python authorization, model or player effects, usability, immersion, G4, or G6.
    evidence:
      - _workspace/current/engineering/tech-verification/current.json
      - _workspace/current/engineering/tech-verification/evidence/godot-4.7.1-20260813t115916z-sealed-lighthouse-render-v5/evidence-manifest.json
      - _workspace/current/engineering/tech-verification/evidence/godot-4.7.1-20260813t115916z-sealed-lighthouse-render-v5/rendered-canonical-v1/capture-manifest.json
      - _workspace/current/engineering/tech-verification/evidence/godot-4.7.1-20260813t115916z-sealed-lighthouse-render-v5/rendered-canonical-v1/sl-rc-001-arrival.png
      - _workspace/current/engineering/tech-verification/evidence/godot-4.7.1-20260813t115916z-sealed-lighthouse-render-v5/rendered-canonical-v1/sl-rc-002-rejected-secret.png
      - _workspace/current/engineering/tech-verification/evidence/godot-4.7.1-20260813t115916z-sealed-lighthouse-render-v5/rendered-canonical-v1/sl-rc-003-authorized-hint.png
    status: verified-authored-engine-render-fixture
  - id: C-RESULT-001
    claim: TRACE-RPG reduces hard violations versus LLM-only baselines.
    evidence: []
    status: TODO-RESULT
    non_supporting_artifacts:
      - research/codex_feedback_pilot/public-v5/paired-model-comparison-20261110-v5-gpt-5.6-luna/results.json
      - research/codex_feedback_pilot/public-v5/paired-model-comparison-20261110-v5-gpt-5.6-terra/results.json
      - research/codex_feedback_pilot/paired-model-comparison-20261110-v5-source.zip
    scope_note: >-
      The fresh v5 synthetic development collection is separate from E1 and all
      earlier cohorts, not evidence that TRACE-RPG reduces violations in a population.
      All 20 assignments received responses. Stage 1 strict parsing failed on 10/20
      (Luna 1/10, Terra 9/10; CandidateParseError with null evaluation), leaving 10
      parsed candidates. Stage 2 state-relative validation accepted 8/10 parsed
      candidates: Luna Detailed 4/4, Luna Generic 3/5, Terra Detailed 0/0 (not
      estimable), and Terra Generic 1/1. On the full assigned denominators, gate
      acceptance was 8/20 and independently specified objective success was 7/20.
      Per five assigned cases, received/gate/goal/schema-failure counts were Luna
      Detailed 5/4/3/1, Luna Generic 5/3/3/0, Terra Detailed 5/0/0/5, and Terra
      Generic 5/1/1/4. The unauthorized_objective fixture forbids signal effects
      while the objective requires signal_restored; its single Luna Detailed
      response was gate-accepted with empty effects but failed the objective.
      The two parsed rejections record unchanged fallback states; parse failures
      have no evaluation receipt, so their mutation outcomes are not observed
      measurements. Provider-attested model identity/revision, seed, and cost
      remain unknown. Raw CLI stdout/stderr were not retained; digests and byte
      counts cannot establish content-level parse-failure causes. These are
      descriptive pipeline counts, not causal feedback effects, model rankings,
      new holdout evidence, or a promotion of any TODO-RESULT claim.
  - id: C-RESULT-002
    claim: Affect adaptation improves target-curve tracking without validity regression.
    evidence: []
    status: TODO-RESULT
  - id: C-RESULT-003
    claim: Structured counterexample repair is more sample-efficient than blind retry at matched K.
    evidence:
      - research/academic-pipeline/rq2-live-pilot/signal-repair-v2/policy_blind/summary.json
      - research/academic-pipeline/rq2-live-pilot/signal-repair-v2/policy_blind/results.jsonl
      - research/academic-pipeline/rq2-live-pilot/promotion-manifest.json
      - research/academic-pipeline/stage-04-pilot/repair-arm-summary.csv
    status: TODO-RESULT
    promotion_blocked_by: >-
      The current paper boundary deliberately keeps every C-RESULT-00N at TODO-RESULT.
      scripts/validate_game_studio.py enforces that Cycle-1 guard, and D-049 records the
      explicit decision not to use the more permissive generic workflow transition for
      this five-seed, single-model screening packet. The evidence is reported only under
      C-PILOT-007 and C-PILOT-008. Promotion requires the confirmatory preregistration,
      templated scenario battery, independent semantic oracle, and planned model scope;
      it is not waiting on a metadata-only status change.
    scope_note: >-
      Live support exists ONLY in the regime where the proposer's errors fall in the
      guided-repairable class. On the corrected pre-registered signal-repair-v2 state with
      the constraint table withheld, guided repair committed 5/5 and blind unchanged retry
      committed 0/5 over the identical per-seed proposal at matched K=1. The same
      comparison was null in three other executed regimes (see C-PILOT-007). The state was
      deliberately constructed to contain repairable failure modes, so this is a
      mechanism-transfer demonstration, not evidence that the regime is representative.
      Confirmatory promotion still requires templated scenarios, an independent semantic
      oracle, and a preregistration hash.
  - id: C-PILOT-007
    claim: >-
      Executed live screening pilot (gpt-5.6-sol via the Codex CLI, 5 seeds per cell,
      matched budget K=1, one proposal shared by both arms). The guided-vs-blind separation
      is regime-dependent. On the frozen offline base state the proposer returned 5/5
      first-shot valid candidates with and without the constraint table, because that state
      admits a zero-effect valid action, so no repair was exercised; forbidding a zero-effect
      action there produced 5/5 invalid candidates whose errors were all
      QUEST_STAGE_REGRESSION, a guided-irreparable class, and both arms committed 0/5. On the
      corrected signal-repair-v2 state with the table withheld, live errors were
      POLICY_EFFECT_OMISSION, POLICY_EFFECT_VIOLATION, and POLICY_PRECONDITION_OMISSION, and
      guided repair cleared every error to commit 5/5 while blind retry committed 0/5. Every
      fallback in every cell preserved the prior state hash.
    evidence:
      - research/academic-pipeline/rq2-live-pilot/frozen-pilot-base/policy_visible/summary.json
      - research/academic-pipeline/rq2-live-pilot/frozen-pilot-base/policy_blind/summary.json
      - research/academic-pipeline/rq2-live-pilot/frozen-pilot-base/goal_directed_blind/summary.json
      - research/academic-pipeline/rq2-live-pilot/signal-repair-v2/policy_blind/summary.json
      - research/academic-pipeline/rq2-live-pilot/promotion-manifest.json
    status: pilot-only
  - id: C-PILOT-008
    claim: >-
      In the live pilot, proposer errors co-occurred rather than appearing singly, and a
      single guided-irreparable code blocked commit even when the repairable codes were
      cleared. On the superseded signal-repair v1 state the operator reduced the error set
      from three codes to one (removing POLICY_EFFECT_OMISSION and POLICY_EFFECT_VIOLATION)
      but could not commit because NPC_KNOWLEDGE_VIOLATION remained, which the operator
      declines to repair by contract. Per-error repair therefore does not compose into a
      commit unless every co-occurring error is repairable at the given budget.
    evidence:
      - research/academic-pipeline/rq2-live-pilot/signal-repair/policy_blind/results.jsonl
      - research/academic-pipeline/rq2-live-pilot/promotion-manifest.json
    status: pilot-only
  - id: C-RESULT-004
    claim: Graph retrieval plus event-sourced temporal memory reduces long-horizon contradictions at matched validity.
    evidence: []
    status: TODO-RESULT
    non_supporting_artifacts:
      - research/simulation/kg-ontology/latest/evaluation-matrix.json
    exclusion_reason: >-
      SL-KG-ONTOLOGY-SIM-001 is an authored closed-world methods-link holdout. It does not execute
      runtime graph retrieval, temporal memory, or long-horizon game episodes and therefore cannot
      promote this claim.
  - id: C-RESULT-005
    claim: The controller effect is directionally consistent across model access and scale strata.
    evidence: []
    status: TODO-RESULT

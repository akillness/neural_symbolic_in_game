claims:
  - id: C-METHOD-001
    claim: LLM proposals can be incrementally grounded by symbolic validation for playable IF world generation.
    evidence: [ivie-2026]
    status: verified-scope-limited
  - id: C-METHOD-002
    claim: The benefit of symbolic dialogue scaffolding can depend on NPC role and does not universally improve player experience.
    evidence: [scaffolded-play-2025]
    status: verified-scope-limited
  - id: C-DATA-001
    claim: KNUDGE evaluates branching NPC dialogue against quest and entity specifications from The Outer Worlds.
    evidence: [knudge-2022]
    status: verified-primary
  - id: C-AFFECT-001
    claim: A recent 2026 preprint reports a perception-understanding gap for engagement inference in the games it evaluates.
    evidence: [gamevibe-vlm-2026]
    status: verified-scope-limited-preprint
  - id: C-SYSTEM-001
    claim: TRACE-RPG treats encoded hard predicates as a pre-commit gate while narrative, affect, retrieval, and memory signals remain non-authoritative proposal context.
    evidence: [ivie-2026]
    status: proposed-contribution
  - id: C-PILOT-001
    claim: In the authored Stage 4 fixtures, the loader-enforced set covered all 12 implemented error codes and observed outcomes matched 13/13 authored expectations; this is authored-oracle conformance, not an independent success rate.
    evidence:
      - research/academic-pipeline/stage-04-pilot/pilot-results.json
      - research/academic-pipeline/stage-04-pilot/sha256-manifest.json
    status: verified-designed-fixture
  - id: C-PILOT-002
    claim: Across the 12 authored initially-invalid repair cases at matched budget K=1, rejection-only committed 0/12 and unchanged retry committed 0/12, while counterexample-guided repair committed 5/12 and the state-reading policy-restore oracle committed 6/12; every non-committing arm left the prior state hash unchanged.
    evidence:
      - research/academic-pipeline/stage-04-pilot/pilot-results.json
      - research/academic-pipeline/stage-04-pilot/repair-arms.csv
      - research/academic-pipeline/stage-04-pilot/repair-arm-summary.csv
    status: verified-designed-fixture
  - id: C-PILOT-006
    claim: Per frozen repairability class, guided repair committed 5/5 guided_repairable, 0/1 oracle_only, and 0/6 irreparable, while the oracle arm additionally committed the single oracle_only case; guided commits used a mean changed-field edit distance of 1.0. This separates model-free counterexample repair from state-reading repair on authored fixtures and is not a live-model repair-quality result.
    evidence:
      - research/academic-pipeline/stage-04-pilot/repair-class-summary.csv
      - research/academic-pipeline/stage-04-pilot/pilot-results.json
    status: verified-designed-fixture
  - id: C-PILOT-003
    claim: All 10 faults prespecified as detectable were rejected by their designated operations without detector-layer attribution, while substitution of a different invalid precursor before the same valid repair was replay-accepted 1/1 as the separately declared provenance boundary.
    evidence:
      - research/academic-pipeline/stage-04-pilot/pilot-results.json
      - research/academic-pipeline/stage-04-pilot/integrity-faults.csv
      - research/academic-pipeline/stage-04-pilot/integrity-boundaries.csv
    status: verified-designed-fixture
  - id: C-PILOT-004
    claim: The seven authored adapter/accounting assignments yielded 1 commit, 1 symbolic fallback, and 5 adapter failures, and all 3 injected assignment guards rejected.
    evidence:
      - research/academic-pipeline/stage-04-pilot/pilot-results.json
      - research/academic-pipeline/stage-04-pilot/adapter-accounting.csv
      - research/academic-pipeline/stage-04-pilot/accounting-guards.csv
    status: verified-designed-fixture
  - id: C-PILOT-005
    claim: The frozen Stage 4 manifest binds 64 published-row provenance records, including the closed unknown-key regression and fault-specific input specifications, and the tracked release records its input and artifact checksums.
    evidence:
      - research/academic-pipeline/stage-04-pilot/pilot-assignment-manifest.json
      - research/academic-pipeline/stage-04-pilot/sha256-manifest.json
    status: verified-designed-fixture
  - id: C-GAME-DESIGN-001
    claim: The approved Sealed Lighthouse protocol separates a structured-state/text primary track from a frozen-image VLM/UI secondary track, with image generation prohibited during experiment execution.
    evidence:
      - configs/experimental-game.yaml
      - game-track/assets/concepts/asset-manifest.json
      - ../.omx/specs/deep-interview-experimental-game-track.md
    status: approved-design-protocol
  - id: C-GAME-DESIGN-002
    claim: The engine-local Godot evidence comprises four authored fixtures. The canonical, duplicate-ID, and timeout fixtures completed their declared multi-step, failure-isolation, save/load, operation-replay, and terminal/reference-hash checks; the corrupt-save fixture separately verified rejection without canonical-state mutation. A stable-envelope projection test exists, but live Python authorization transport remains unexecuted.
    evidence:
      - configs/experimental-game.yaml
      - research/academic-pipeline/stage-06-peer-review-simulation.md
      - _workspace/current/engineering/tech-verification/godot-headless.md
      - _workspace/current/engineering/tech-verification/current.json
    status: verified-authored-engine-fixture
  - id: C-GAME-DESIGN-003
    claim: In the retained Godot 4.7.1 render packet, three non-headless 1280x720 primary-track PNGs are content-hashed and bound to canonical scripted-fixture event IDs, delivery indices, validation outcomes, and before/after world-state hashes; this establishes authored engine render/state correspondence only, not live Python authorization, model or player effects, usability, immersion, G4, or G6.
    evidence:
      - _workspace/current/engineering/tech-verification/current.json
      - _workspace/current/engineering/tech-verification/evidence/godot-4.7.1-20260813t115916z-sealed-lighthouse-render-v5/evidence-manifest.json
      - _workspace/current/engineering/tech-verification/evidence/godot-4.7.1-20260813t115916z-sealed-lighthouse-render-v5/rendered-canonical-v1/capture-manifest.json
      - _workspace/current/engineering/tech-verification/evidence/godot-4.7.1-20260813t115916z-sealed-lighthouse-render-v5/rendered-canonical-v1/sl-rc-001-arrival.png
      - _workspace/current/engineering/tech-verification/evidence/godot-4.7.1-20260813t115916z-sealed-lighthouse-render-v5/rendered-canonical-v1/sl-rc-002-rejected-secret.png

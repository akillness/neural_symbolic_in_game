    claim: TRACE-RPG reduces hard violations versus LLM-only baselines.
    evidence: []
    status: TODO-RESULT
  - id: C-RESULT-002
    claim: Affect adaptation improves target-curve tracking without validity regression.
    evidence: []
    status: TODO-RESULT
  - id: C-RESULT-003
    claim: Structured counterexample repair is more sample-efficient than blind retry at matched K.
    evidence: []
    status: TODO-RESULT
    note: >-
      The 2026-08-28 live screening pilot (SL-RQ2-LIVE-001) did NOT support this claim.
      See C-PILOT-007: the live proposer's error distribution did not overlap the
      guided-repairable class, so guided and blind arms were indistinguishable in every
      executed condition. The claim stays TODO-RESULT rather than being promoted.
  - id: C-PILOT-007
    claim: >-
      In an executed live screening pilot over one frozen base state (gpt-5.6-sol via the
      Codex CLI, 5 seeds x 3 pre-registered conditions, matched budget K=1, one proposal
      shared by both arms), guided repair and blind unchanged retry were indistinguishable.
      With the constraint table visible and with it withheld, the proposer returned 5/5
      first-shot valid candidates, so no repair was exercised. Under the goal-directed
      condition that forbids a zero-effect action, the proposer returned 5/5 invalid
      candidates whose errors were all QUEST_STAGE_REGRESSION, a frozen guided-irreparable
      class, so both arms committed 0/5 and every fallback left the prior state hash
      unchanged. This is screening-tier evidence about one base state and one hosted
      revision, not a repair-method refutation.
    evidence:
      - research/academic-pipeline/rq2-live-pilot/policy_visible/summary.json
      - research/academic-pipeline/rq2-live-pilot/policy_blind/summary.json
      - research/academic-pipeline/rq2-live-pilot/goal_directed_blind/summary.json
      - research/academic-pipeline/rq2-live-pilot/goal_directed_blind/results.jsonl
    status: pilot-only

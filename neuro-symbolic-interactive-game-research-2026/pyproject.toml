[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-rpg-research"
version = "0.1.0"
description = "Auditable neuro-symbolic controller and evaluation scaffold for interactive games"
requires-python = ">=3.11"
license = "LicenseRef-Unspecified"

[project.optional-dependencies]
research = [
  "jsonschema>=4.23",
  "networkx>=3.4",
  "pyyaml>=6.0",
]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

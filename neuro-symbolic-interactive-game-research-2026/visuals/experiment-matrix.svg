<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">TRACE-RPG confirmatory experiment matrix</title>
  <desc id="desc">Three promoted models are crossed with six controller systems and three game research tracks, followed by shared validity, quality, affect, and system metrics.</desc>
  <defs><style>.bg{fill:#111827}.x{fill:#23304c;stroke:#6ea8fe;stroke-width:2}.y{fill:#283b32;stroke:#59d4a0;stroke-width:2}.z{fill:#432434;stroke:#ff6b8a;stroke-width:2}.t{font:15px system-ui,sans-serif;fill:#f2f6ff}.s{font:13px system-ui,sans-serif;fill:#cdd8ee}.h{font:bold 22px system-ui,sans-serif;fill:white}.a{stroke:#9fb4dc;stroke-width:3;marker-end:url(#m)}</style><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9fb4dc"/></marker></defs>
  <rect class="bg" width="1100" height="520" rx="18"/><text class="h" x="36" y="45">Confirmatory experiment · 3 × 6 × 3</text>
  <rect class="x" x="35" y="95" width="260" height="155" rx="14"/><text class="t" x="62" y="130">Promoted models (3)</text><text class="s" x="62" y="163">hosted frontier control</text><text class="s" x="62" y="190">strong feasible open-weight</text><text class="s" x="62" y="217">≤32 GB deployment profile</text>
  <rect class="y" x="420" y="75" width="285" height="195" rx="14"/><text class="t" x="448" y="110">Controller systems (6)</text><text class="s" x="448" y="140">LLM-only · RAG · KG</text><text class="s" x="448" y="167">KG + policy</text><text class="s" x="448" y="194">validator + repair</text><text class="s" x="448" y="221">full + affect</text><text class="s" x="448" y="248">+ six matched ablations</text>
  <rect class="z" x="830" y="95" width="235" height="155" rx="14"/><text class="t" x="858" y="130">Tracks (3)</text><text class="s" x="858" y="163">world generation</text><text class="s" x="858" y="190">NPC dialogue</text><text class="s" x="858" y="217">affect adaptation</text>
  <line class="a" x1="295" y1="172" x2="420" y2="172"/><line class="a" x1="705" y1="172" x2="830" y2="172"/>
  <rect class="x" x="235" y="335" width="630" height="125" rx="14"/><text class="t" x="275" y="373">Shared audit: held-out worlds/quests · 5 seeds · exact revisions</text><text class="s" x="275" y="404">hard validity · semantic false accept/reject · matched-validity quality</text><text class="s" x="275" y="430">repair efficiency · affect uncertainty · p95 latency · tokens · VRAM · energy</text>
  <line class="a" x1="550" y1="270" x2="550" y2="335"/>
</svg>


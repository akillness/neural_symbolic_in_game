<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="620" viewBox="0 0 1480 620" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">TRACE-RPG planned confirmatory experiment</title>
  <desc id="svg-desc">A future two-stage design crossing three promoted models with six controller systems over three tracks. No part of this design has been executed.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#E69F00"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7A7A7A"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #202124; }
      .section { font-size: 25px; font-weight: 700; }
      .box-title { font-size: 24px; font-weight: 700; }
      .body { font-size: 21px; font-weight: 400; }
      .small { font-size: 19px; font-weight: 400; }
      .note { font-size: 19px; font-style: italic; fill: #5F6368; }
      .arrow-label { font-size: 19px; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="1480" height="620" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1480" height="96" rx="0" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="0"/>
  <rect x="0" y="0" width="10" height="96" fill="#0072B2"/>
  <text x="34" y="42" class="section" text-anchor="start">V6 · Planned confirmatory design — NOT EXECUTED</text>
  <text x="34" y="74" class="small" text-anchor="start" fill="#5F6368">Shown so the scope is auditable; every element below is future work with no collected data</text>
  <line x1="0" y1="96" x2="1480" y2="96" stroke="#C9CDD1" stroke-width="2" fill="none"/>
  <rect x="40" y="122" width="1400" height="46" rx="7" fill="#EEF0F2" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="740" y="152" class="small" text-anchor="middle" fill="#5F6368">No result in this repository comes from the design below.</text>
  <rect x="40" y="196" width="440" height="232" rx="7" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="40" y="196" width="8" height="232" fill="#7A7A7A"/>
  <text x="66" y="236" class="box-title" text-anchor="start">Promoted models (3)</text>
  <text x="66" y="270" class="small" text-anchor="start">hosted frontier control</text>
  <text x="66" y="297" class="small" text-anchor="start">strong open-weight</text>
  <text x="66" y="324" class="small" text-anchor="start">≤ 32 GB deployment profile</text>
  <text x="66" y="351" class="small" text-anchor="start">promoted by a frozen Pareto rule</text>
  <text x="66" y="378" class="small" text-anchor="start">from a ten-model screen</text>
  <rect x="520" y="196" width="440" height="232" rx="7" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="520" y="196" width="8" height="232" fill="#7A7A7A"/>
  <text x="546" y="236" class="box-title" text-anchor="start">Controller systems (6)</text>
  <text x="546" y="270" class="small" text-anchor="start">LLM-only</text>
  <text x="546" y="297" class="small" text-anchor="start">retrieval-augmented</text>
  <text x="546" y="324" class="small" text-anchor="start">knowledge graph</text>
  <text x="546" y="351" class="small" text-anchor="start">graph + policy</text>
  <text x="546" y="378" class="small" text-anchor="start">validator + bounded repair</text>
  <text x="546" y="405" class="small" text-anchor="start">full + affect (gated)</text>
  <rect x="1000" y="196" width="440" height="232" rx="7" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="1000" y="196" width="8" height="232" fill="#7A7A7A"/>
  <text x="1026" y="236" class="box-title" text-anchor="start">Tracks (3)</text>
  <text x="1026" y="270" class="small" text-anchor="start">world generation</text>
  <text x="1026" y="297" class="small" text-anchor="start">NPC dialogue</text>
  <text x="1026" y="324" class="small" text-anchor="start">affect adaptation</text>
  <text x="1026" y="351" class="small" text-anchor="start">held-out worlds, quest motifs,</text>
  <text x="1026" y="378" class="small" text-anchor="start">NPC identities, relation motifs</text>
  <path d="M480 312 H520" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)" stroke-dasharray="7 6"/>
  <path d="M960 312 H1000" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)" stroke-dasharray="7 6"/>
  <rect x="40" y="444" width="1400" height="130" rx="7" fill="#F7F7F5" stroke="#C9CDD1" stroke-width="2"/>
  <text x="66" y="482" class="box-title" text-anchor="start">Required before any efficacy claim is admitted</text>
  <text x="66" y="514" class="small" text-anchor="start">preregistered primary endpoint · pilot-informed power analysis · mixed-effects model · effect size with 95% CI</text>
  <text x="66" y="542" class="small" text-anchor="start">multiplicity correction · blinded human evaluation at matched validity · independent semantic audit · deterministic replay</text>
</svg>

  <text x="955" y="232" class="small" text-anchor="middle"><tspan x="955" dy="0">Draft + pilot +</tspan><tspan x="955" dy="26">PDFs</tspan></text>
  <text x="955" y="308" class="note" text-anchor="middle" fill="#E69F00"><tspan x="955" dy="0">AWAITING</tspan><tspan x="955" dy="24">APPROVAL</tspan></text>

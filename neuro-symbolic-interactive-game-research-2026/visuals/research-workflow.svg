  <text x="1365" y="232" class="small" text-anchor="middle"><tspan x="1365" dy="0">Citation integrity</tspan></text>
  <text x="1365" y="308" class="note" text-anchor="middle" fill="#7A7A7A"><tspan x="1365" dy="0">NOT EXECUTED</tspan></text>
  <rect x="40" y="380" width="690" height="130" rx="7" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/>
  <text x="66" y="416" class="box-title" text-anchor="start">Produced by the executed stages</text>
  <text x="66" y="448" class="small" text-anchor="start">bilingual six-page IEEE PDFs · 36-record bibliography</text>
  <text x="66" y="476" class="small" text-anchor="start">62 frozen assignments · generated tables · SHA-256 manifest</text>
  <rect x="750" y="380" width="690" height="130" rx="7" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="7 6"/>

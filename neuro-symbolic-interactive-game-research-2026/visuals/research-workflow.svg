  <text x="1160" y="232" class="small" text-anchor="middle"><tspan x="1160" dy="0">Post-draft review</tspan></text>
  <text x="1160" y="308" class="note" text-anchor="middle" fill="#7A7A7A"><tspan x="1160" dy="0">NOT EXECUTED</tspan></text>
  <path d="M1255 248 H1270" stroke="#7A7A7A" stroke-width="3" fill="none" marker-end="url(#arrow-gray)" stroke-dasharray="5 4"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">TRACE-RPG system architecture</title>
  <desc id="desc">A game engine sends versioned observations to a research controller. Retrieval and model proposals pass through a hard symbolic commit gate before canonical state can change.</desc>
  <defs>
    <style>
      .bg{fill:#0b1020}.box{fill:#151d35;stroke:#6ea8fe;stroke-width:2}.hard{fill:#351b2b;stroke:#ff6b8a;stroke-width:3}.soft{fill:#18352e;stroke:#59d4a0;stroke-width:2}.txt{fill:#eef4ff;font:16px system-ui,sans-serif}.small{fill:#c8d4ee;font:13px system-ui,sans-serif}.head{fill:#fff;font:bold 22px system-ui,sans-serif}.arrow{stroke:#9fb4dc;stroke-width:3;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9fb4dc"/></marker>
  </defs>
  <rect class="bg" width="1200" height="620" rx="18"/>
  <text class="head" x="42" y="48">TRACE-RPG · learned proposals, symbolic authority</text>

  <rect class="box" x="40" y="105" width="230" height="150" rx="14"/>
  <text class="txt" x="66" y="142">Game track</text>
  <text class="small" x="66" y="174">Godot / Unity / mock</text>
  <text class="small" x="66" y="200">observations · actions</text>
  <text class="small" x="66" y="226">state-hash replay</text>

  <rect class="box" x="345" y="86" width="250" height="88" rx="14"/>
  <text class="txt" x="370" y="122">Evidence retrieval</text>
  <text class="small" x="370" y="148">typed KG · policy · event prefix</text>

  <rect class="soft" x="345" y="208" width="250" height="112" rx="14"/>
  <text class="txt" x="370" y="246">Model proposal</text>
  <text class="small" x="370" y="273">10-model screen → 3 confirmatory</text>
  <text class="small" x="370" y="296">schema-constrained candidate</text>

  <rect class="hard" x="680" y="125" width="270" height="180" rx="14"/>
  <text class="txt" x="706" y="164">Hard commit gate</text>
  <text class="small" x="706" y="195">precondition · reachability</text>
  <text class="small" x="706" y="220">NPC knowledge · disclosure</text>
  <text class="small" x="706" y="245">quest · schema · repair K</text>
  <text class="small" x="706" y="275">invalid ⇒ reject / safe fallback</text>

  <rect class="box" x="1010" y="125" width="150" height="180" rx="14"/>
  <text class="txt" x="1034" y="164">Commit</text>
  <text class="small" x="1034" y="196">canonical</text>
  <text class="small" x="1034" y="220">world state</text>
  <text class="small" x="1034" y="252">immutable</text>
  <text class="small" x="1034" y="276">trace</text>

  <rect class="soft" x="345" y="390" width="250" height="118" rx="14"/>
  <text class="txt" x="370" y="429">Soft adaptation</text>
  <text class="small" x="370" y="456">temporal memory · affect</text>
  <text class="small" x="370" y="481">uncertainty fallback</text>

  <rect class="box" x="680" y="390" width="480" height="118" rx="14"/>
  <text class="txt" x="706" y="429">Research harness and observability</text>
  <text class="small" x="706" y="456">source/claim ledger · exact revisions · latency/energy</text>
  <text class="small" x="706" y="481">fact → logic → design → statistics → bilingual review</text>

  <path class="arrow" d="M270 180 H345"/>
  <path class="arrow" d="M595 130 H630 V175 H680"/>
  <path class="arrow" d="M595 264 H680"/>
  <path class="arrow" d="M950 215 H1010"/>
  <path class="arrow" d="M1085 305 V345 H155 V255"/>
  <path class="arrow" d="M470 390 V320"/>
  <path class="arrow" d="M805 305 V390"/>

  <text class="small" x="45" y="574">Invariant: no model, memory, retrieval, or affect score may bypass the hard gate.</text>
</svg>


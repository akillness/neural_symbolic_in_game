metrics:
  - id: valid_episode_rate
    formula: valid_completed_episodes / attempted_episodes
    direction: maximize
    type: primary
  - id: hard_violation_per_commit
    formula: hard_violations_on_committed_actions / committed_actions
    direction: minimize
    type: primary
  - id: quest_solvability
    formula: planner_solved_quests / evaluated_quests
    direction: maximize
    type: deterministic
  - id: forbidden_disclosure_rate
    formula: forbidden_facts_disclosed / disclosure_opportunities
    direction: minimize
    type: deterministic
  - id: unknown_fact_usage_rate
    formula: facts_outside_npc_knowledge / asserted_facts
    direction: minimize
    type: deterministic
  - id: repair_at_k
    formula: invalid_candidates_repaired_within_k / invalid_candidates
    direction: maximize
    type: process
  - id: diversity_at_matched_validity
    formula: structural_diversity conditioned on equal hard-validity band
    direction: maximize
    type: secondary
  - id: human_naturalness
    formula: blinded ordinal rating with rater random effect
    direction: maximize
    type: human
  - id: target_tension_rmse
    formula: sqrt(mean((predicted_tension - target_tension)^2))
    direction: minimize
    type: affect
  - id: tension_ccc
    formula: concordance_correlation(target_tension, predicted_tension)
    direction: maximize
    type: affect
  - id: p95_latency_ms
    formula: percentile(total_request_latency_ms, 95)
    direction: minimize
    type: systems
    estimand: all_assigned_cases
    timeout_policy: preregister deadline censoring or a fixed timeout cap before confirmatory use
  - id: provider_response_latency_p95_ms
    formula: percentile(recorded_provider_latency_ms among responses received, 95)
    direction: minimize
    type: diagnostic
    estimand: response_observed_cases_only
    companion_count: latency_observed_cases
  - id: adapter_failure_rate
    formula: adapter_failures / all_assigned_cases
    direction: minimize
    type: systems
  - id: overall_failure_rate
    formula: non_committed_assigned_cases / all_assigned_cases
    direction: minimize
    type: systems
  - id: hard_validation_failure_rate
    formula: symbolic_validation_fallbacks / all_assigned_cases
    direction: minimize
    type: primary
  - id: tokens_per_valid_commit
    formula: total_tokens / valid_committed_actions
    direction: minimize
    type: systems
  - id: validator_false_negative_rate
    formula: human_confirmed_hard_violations_missed / human_confirmed_hard_violations
    direction: minimize
    type: audit
  - id: validator_false_positive_rate
    formula: valid_actions_rejected / human_confirmed_valid_actions
    direction: minimize
    type: audit
  - id: engine_terminal_state_hash_match_rate
    formula: engine_replays_matching_reference_terminal_hash / completed_engine_replays
    direction: maximize
    type: engine-conformance
    zero_denominator: NA
  - id: save_load_state_hash_match_rate
    formula: save_load_cycles_matching_pre_save_hash / completed_save_load_cycles
    direction: maximize
    type: engine-conformance
    zero_denominator: NA
  - id: duplicate_event_nonmutation_rate
    formula: duplicate_deliveries_with_unchanged_state / duplicate_event_injections
    direction: maximize
    type: engine-conformance
    zero_denominator: NA
  - id: failure_path_nonmutation_rate
    formula: timeout_adapter_controller_failures_with_full_state_equality / injected_failure_paths
    direction: maximize
    type: engine-conformance
    zero_denominator: NA
  - id: engine_frame_p95_ms
    formula: percentile(engine_frame_ms, 95)
    direction: minimize
    type: engine-performance
    threshold_target: 16.7
    estimand: frames-in-the-frozen-engine-scenario
  - id: engine_long_frame_rate
    formula: frames_over_16_7_ms / measured_frames
    direction: minimize
    type: engine-performance
    threshold_target: 0.005
  - id: engine_input_latency_p95_ms
    formula: percentile(input_to_visible_feedback_ms, 95)
    direction: minimize
    type: engine-performance
    threshold_target: 100
  - id: engine_memory_soak_delta_mb
    formula: resident_memory_mb_at_30_min - resident_memory_mb_after_warmup
    direction: minimize
    type: engine-performance
    interpretation: report observed curve and platform; no universal threshold in Cycle 1
  - id: oracle_encoded_agreement_rate
    formula: controller_encoded_label_equal_independent_encoded_label / independently_labelled_candidates
    direction: maximize
    type: independent-audit
    zero_denominator: NA
  - id: oracle_semantic_false_negative_rate
    formula: independently_labelled_semantic_hazards_committed / independently_labelled_semantic_hazards
    direction: minimize
    type: independent-audit
    zero_denominator: NA

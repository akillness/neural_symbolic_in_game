rules:
  - writer and reviewer must be different roles
  - raw sources and run traces are immutable
  - result claims require trace, analysis, and reviewer identifiers
  - failed gates remain visible under _workspace/current/qa and _workspace/current/production/gate-reviews
  - production lore QA and the independently authored research oracle remain separate
  - generated concept images never enter the primary structured-state experiment track

# NOTE (2026-08-28): for the planned efficacy claims C-RESULT-001..005 this
# transition table is currently overridden by the Cycle-1 studio boundary in
# scripts/validate_game_studio.py::check_claim_boundary, which fail-closes when any
# of them leaves TODO-RESULT. That boundary is a user-stated non-goal from
# .omx/specs/deep-interview-experimental-game-track.md, so the pilot-only
# transition below is unreachable for those five ids until the owner lifts it.
# The contradiction and the two resolution options are recorded in
# _workspace/current/conflicts.md. C-PILOT-* claims are unaffected.
states: [TODO-RESULT, pilot-only, confirmatory-pending-review, verified-empirical, revoked]
transitions:
  - from: TODO-RESULT
    to: pilot-only
    requires: [trace_manifest, schema_pass, pilot_label]
  - from: TODO-RESULT
    to: confirmatory-pending-review
    requires: [preregistration_hash, trace_manifest, analysis_hash, no_pilot_rows]
  - from: confirmatory-pending-review
    to: verified-empirical
    requires: [statistical_review, semantic_audit, bilingual_claim_parity, artifact_replay]
  - from: verified-empirical
    to: revoked
    requires: [upstream_hash_changed_or_audit_failed]
forbidden:
  - TODO-RESULT_to_verified-empirical
  - pilot-only_to_verified-empirical


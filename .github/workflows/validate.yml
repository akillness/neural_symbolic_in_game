name: validate

on:
  push:
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    env:
      # Hermetic SDK contracts, not native Aside service certification.
      NSG_BROWSER_BACKEND: aside
      NSG_ASIDE_TEST_TRANSPORT: playwright
    defaults:
      run:
        working-directory: neuro-symbolic-interactive-game-research-2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Install PDF and deployment inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils rsync
      - name: Install locked environment
        run: uv sync --extra research --extra dev
      - name: Install pinned contract browser runtime
        run: |
          export NODE_PATH="$RUNNER_TEMP/nsg-browser-runtime/lib/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/nsg-playwright-browsers"
          printf 'NODE_PATH=%s\nPLAYWRIGHT_BROWSERS_PATH=%s\n' "$NODE_PATH" "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          npm install --global --prefix "$RUNNER_TEMP/nsg-browser-runtime" playwright@1.65.0
          "$RUNNER_TEMP/nsg-browser-runtime/bin/playwright" install --with-deps chromium
          echo "$RUNNER_TEMP/nsg-browser-runtime/bin" >> "$GITHUB_PATH"
      - name: Unit and publication regression tests
        run: uv run pytest tests -q
      - name: Ruff lint and format
        run: |
          uv run ruff check src tests scripts examples
          uv run ruff format --check src tests scripts examples
      - name: Project integrity
        run: uv run python scripts/validate_project.py
      - name: Contribution and reference crosswalk
        run: uv run python scripts/validate_contribution_crosswalk.py
      - name: Editable visual and table sources
        run: uv run python scripts/validate_visual_assets.py --require-pdf-tools --check-regeneration
      - name: Offline experiment smoke
        run: uv run python examples/recorded_experiment.py
      - name: Harness structure
        run: uv run python scripts/validate_harness.py
      - name: Experimental game-track contracts
        run: ./scripts/validate_game_track.sh
      - name: Deep-research result contracts
        run: uv run python scripts/validate_deep_research.py --fields research/deep-research/fields.yaml --dir research/deep-research/results --quiet
      - name: Survey artifact contract
        run: uv run python scripts/validate_survey_artifacts.py ../.survey/neuro-symbolic-interactive-game-2026 --require-provenance
      - name: Wiki lint
        run: uv run python scripts/lint_wiki.py ../llm-wiki
